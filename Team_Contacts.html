    <script>
        (function() {
            try {
                var _fetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
                var defineFetchProp = function(target) {
                    if (!target) return;
                    try {
                        Object.defineProperty(target, 'fetch', {
                            get: function() { return _fetch; },
                            set: function(val) { _fetch = val; },
                            configurable: true,
                            enumerable: true
                        });
                    } catch (_) {}
                };
                defineFetchProp(window);
                if (typeof Window !== 'undefined' && Window.prototype) {
                    defineFetchProp(Window.prototype);
                }
            } catch (e) {}
            try {
                window.addEventListener('error', function(event) {
                    if (
                        (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
                        (event.message && (
                            event.message.indexOf('Cannot set property fetch') !== -1 ||
                            event.message.indexOf('fetch of #<Window>') !== -1
                        ))
                    ) {
                        event.preventDefault();
                        if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
                        return true;
                    }
                }, true);
            } catch (e) {}
        })();
    </script>

* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif, sans-serif; -webkit-tap-highlight-color: transparent; }

    <script>

        const THEME_KEY = 'tabreed_selected_theme';
        const LS_DARK = 'tabreed_dark_mode';

        function applyUserSettings(settings) {
            document.body.classList.remove('toast-minimal', 'toast-glassy', 'toast-outlined', 'toast-neon', 'toast-soft-shadow', 'toast-solid');
            if (settings && settings.toastStyle && settings.toastStyle !== 'default') {
                document.body.classList.add('toast-' + settings.toastStyle);
            } else {
                document.body.classList.add('toast-outlined');
            }
            const container = document.getElementById('toastContainer');
            if (container) {
                container.className = 'toast-container ' + (settings && settings.toastPosition ? settings.toastPosition : 'pos-bottom');
            }
        }
        
        function loadCurrentUserAndSettings() {
            try {
                const curUserStr = localStorage.getItem('tabreed_currentUser');
                if (curUserStr) {
                    const curUser = JSON.parse(curUserStr);
                    const code = curUser.code || curUser.empId;
                    if (code) {
                        const settingsStr = localStorage.getItem('tabreed_settings_' + code);
                        if (settingsStr) {
                            applyUserSettings(JSON.parse(settingsStr));
                        }
                    }
                }
            } catch(e){}
        }
        
        document.addEventListener('DOMContentLoaded', loadCurrentUserAndSettings);

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const t = document.createElement('div');
            t.className = 'toast';
            const colors = { success:'var(--secondary)', error:'var(--danger)', warning:'var(--warning)', info:'var(--primary)' };
            const icons  = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
            const safeMsg = msg ? String(msg).replace(/[<>"'&]/g, c => ({ '<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;' }[c])) : '';
            t.innerHTML  = `<i class="fas ${icons[type]||icons.info}" style="color:${colors[type]||colors.info};font-size:1.1rem;flex-shrink:0;"></i><span>${safeMsg}</span>`;
            container.appendChild(t);
            setTimeout(() => { t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),320); }, 2600);
        }
    
        const ALL_THEME_CLASSES = [
            'dark-mode', 'theme-ocean-blue', 'theme-industrial',
            'theme-emerald-forest', 'theme-royal-purple', 'theme-crimson-red',
            'theme-nordic-teal', 'theme-slate-minimal', 'theme-cyber-dark'
        ];

        function applyTheme() {
            const themeId = localStorage.getItem(THEME_KEY) || (localStorage.getItem(LS_DARK) === '1' ? 'dark-mode' : 'default');
            document.body.classList.remove(...ALL_THEME_CLASSES);
            if (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark') {
                document.body.classList.add('dark-mode');
            }
            if (themeId && themeId !== 'default') {
                if (themeId !== 'dark-mode') {
                    const finalTheme = themeId.startsWith('theme-') ? themeId : `theme-${themeId}`;
                    document.body.classList.add(finalTheme);
                }
            }
            const isDark = (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark');
            const icon = document.getElementById('darkModeToggleBtn');
            if (icon) {
                icon.className  = isDark ? 'fas fa-sun' : 'fas fa-moon';
                icon.style.color = isDark ? '#fdd663' : '#94a3b8';
            }
        }

        applyTheme();
        function toggleDarkMode() {
            const isCurrentlyDark = document.body.classList.contains('dark-mode');
            const newTheme = isCurrentlyDark ? 'default' : 'dark-mode';
            localStorage.setItem(LS_DARK, isCurrentlyDark ? '0' : '1');
            localStorage.setItem(THEME_KEY, newTheme);
            applyTheme();
        }

        let EMPLOYEES = [];
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_XKC1cV1VaeqKB2MbQgmRSOYmcxQI0v-5qcAAKhFczNOwU3GsindACIkuawzQZN4/exec";
        const LS_CONTACTS_CACHE = 'tabreed_team_contacts_cache';
        const LS_LAST_HIST_ID = 'tabreed_team_contacts_last_hist_id';

        async function initApp() {
            if (localStorage.getItem('tabreed_dark_mode') === 'true') {
                document.body.classList.add('dark-mode');
            }

            // 1. Caching system: load and render immediately from cache if available
            try {
                const cachedStr = localStorage.getItem(LS_CONTACTS_CACHE);
                if (cachedStr) {
                    const cached = JSON.parse(cachedStr);
                    if (Array.isArray(cached) && cached.length > 0) {
                        EMPLOYEES = cached;
                        renderContacts(EMPLOYEES);
                    }
                }
            } catch(e) {}

            // 2. Fetch fresh data from Google Sheet "Team Contacts" tab in background
            await syncWithGoogleSheet(false);
        }

        async function syncWithGoogleSheet() {
            if (!navigator.onLine) return;

            let fetchedData = null;

            // 1. Try local server endpoint which proxies Google Sheet Team Contacts
            try {
                const res = await fetch('/api/team-contacts?refresh=true&t=' + Date.now());
                if (res.ok) {
                    const json = await res.json();
                    if (json.status === 'success' && Array.isArray(json.data) && json.data.length > 0) {
                        fetchedData = json.data;
                    }
                }
            } catch (e) {
                console.warn("Local API team-contacts fetch failed:", e);
            }

            // 2. Direct fallback to Google Apps Script
            if (!fetchedData) {
                try {
                    const res = await fetch(APPS_SCRIPT_URL + '?action=getTeamContacts&t=' + Date.now(), { redirect: 'follow' });
                    if (res.ok) {
                        const json = await res.json();
                        if (json.status === 'success' && Array.isArray(json.data) && json.data.length > 0) {
                            fetchedData = json.data;
                        }
                    }
                } catch (e) {
                    console.warn("Direct Apps Script team-contacts fetch failed:", e);
                }
            }

            // 3. Fallback to employees.json if both empty and EMPLOYEES empty
            if (!fetchedData && EMPLOYEES.length === 0) {
                try {
                    const res = await fetch('employees.json');
                    fetchedData = await res.json();
                } catch(e) {
                    console.error("Failed to load base employees.json", e);
                }
            }

            if (!fetchedData || !Array.isArray(fetchedData) || fetchedData.length === 0) {
                return;
            }

            // 4. Apply any locally pending overrides
            const overrides = JSON.parse(localStorage.getItem('tabreed_contacts_override')) || {};
            fetchedData.forEach(emp => {
                if (overrides[emp.code]) {
                    emp.phone = overrides[emp.code].phone || emp.phone;
                    emp.whatsapp = overrides[emp.code].whatsapp || emp.whatsapp;
                    emp.email = overrides[emp.code].email || emp.email;
                }
            });

            // 5. Diff check: Only update UI and cache if differences exist
            let hasDiff = false;
            if (fetchedData.length !== EMPLOYEES.length) {
                hasDiff = true;
            } else {
                const currentMap = new Map();
                EMPLOYEES.forEach(e => currentMap.set(String(e.code), e));
                for (const f of fetchedData) {
                    const existing = currentMap.get(String(f.code));
                    if (!existing ||
                        existing.phone !== f.phone ||
                        existing.whatsapp !== f.whatsapp ||
                        existing.email !== f.email ||
                        existing.full !== f.full ||
                        existing.short !== f.short) {
                        hasDiff = true;
                        break;
                    }
                }
            }

            if (hasDiff || EMPLOYEES.length === 0) {
                EMPLOYEES = fetchedData;
                try {
                    localStorage.setItem(LS_CONTACTS_CACHE, JSON.stringify(EMPLOYEES));
                } catch(e) {}
                renderContacts(EMPLOYEES);
            }
        }

        function openEditModal(code) {
            const emp = EMPLOYEES.find(e => e.code === code);
            if(!emp) return;
            const overrides = JSON.parse(localStorage.getItem('tabreed_contacts_override')) || {};
            const currentPhone = overrides[code]?.phone || emp.phone || '';
            const currentWhatsapp = overrides[code]?.whatsapp || emp.whatsapp || '';
            const currentEmail = overrides[code]?.email || emp.email || '';
            
            document.getElementById('editCode').value = code;
            document.getElementById('editPhone').value = currentPhone;
            document.getElementById('editWhatsapp').value = currentWhatsapp;
            document.getElementById('editEmail').value = currentEmail;
            
            document.getElementById('editContactModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editContactModal').style.display = 'none';
        }

        async function saveEditContact() {
            const code = document.getElementById('editCode').value;
            const phone = document.getElementById('editPhone').value.trim();
            const whatsapp = document.getElementById('editWhatsapp').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            
            // Save to localStorage overrides
            const overrides = JSON.parse(localStorage.getItem('tabreed_contacts_override')) || {};
            overrides[code] = { phone, whatsapp, email };
            localStorage.setItem('tabreed_contacts_override', JSON.stringify(overrides));
            
            // Update in-memory
            const emp = EMPLOYEES.find(e => e.code === code);
            if(emp) {
                emp.phone = phone;
                emp.whatsapp = whatsapp;
                emp.email = email;
            }
            
            // Update cache
            try {
                localStorage.setItem(LS_CONTACTS_CACHE, JSON.stringify(EMPLOYEES));
            } catch(e) {}

            closeEditModal();
            filterContacts();

            let curUserName = 'User';
            try {
                const curUser = JSON.parse(localStorage.getItem('tabreed_currentUser'));
                if (curUser) curUserName = curUser.short || curUser.full || curUser.name || 'User';
            } catch(e) {}

            const payload = {
                action: 'saveTeamContact',
                code: code,
                short: emp ? emp.short : '',
                full: emp ? emp.full : '',
                role: emp ? (emp.role || '') : '',
                phone: phone,
                whatsapp: whatsapp,
                email: email,
                user: curUserName
            };

            // 1. Send contact update to server proxy
            let synced = false;
            try {
                const res = await fetch('/api/team-contacts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const json = await res.json();
                    if (json.status === 'success') synced = true;
                }
            } catch (e) {
                console.warn("Failed saving via server /api/team-contacts:", e);
            }

            // 2. Direct fallback to Google Apps Script
            if (!synced) {
                try {
                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        redirect: 'follow'
                    });
                    synced = true;
                } catch (e) {
                    console.warn("Direct Apps Script contact save failed:", e);
                }
            }

            // 3. Automatically record in History:
            // "agr kiSine Update kiya to History me Dalo uSe us History k Basic pr New Data Fetch kro from Operation Request k Team Contacts Sheets se"
            const now = new Date();
            const histItem = {
                id: 'hist_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                timestamp: now.toISOString(),
                displayTime: now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                action: 'contact_update',
                actionLabel: 'Contact Updated',
                workOrder: '',
                plant: '',
                description: `Updated contact for ${emp ? emp.short : code} (${code})`,
                details: `Phone: ${phone || 'N/A'}, WhatsApp: ${whatsapp || 'N/A'}, Email: ${email || 'N/A'}`,
                user: curUserName,
                badgeColor: '#059669'
            };

            localStorage.setItem(LS_LAST_HIST_ID, histItem.id);

            // Log to server history
            fetch('/api/operation-history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(histItem)
            }).catch(() => {});

            // Direct push to Google Sheet "History" tab
            try {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'logHistory', historyItem: histItem }),
                    redirect: 'follow'
                }).catch(() => {});
            } catch(e) {}

            showToast(`Contact saved successfully!`, "success");

            // 4. Fetch fresh data from Google Sheet "Team Contacts" based on this update
            setTimeout(() => {
                syncWithGoogleSheet(false);
            }, 800);
        }

        // Automatic detector: checks history periodically; if a contact_update event is detected, re-fetch fresh data from Google Sheet "Team Contacts"
        setInterval(async () => {
            try {
                const res = await fetch('/api/operation-history?t=' + Date.now()).then(r => r.json());
                if (res && res.status === 'success' && Array.isArray(res.data)) {
                    const latestContactUpdate = res.data.find(h => h.action === 'contact_update');
                    if (latestContactUpdate && latestContactUpdate.id) {
                        const lastKnown = localStorage.getItem(LS_LAST_HIST_ID);
                        if (lastKnown && lastKnown !== latestContactUpdate.id) {
                            localStorage.setItem(LS_LAST_HIST_ID, latestContactUpdate.id);
                            // New update found in history: re-fetch from Google Sheet Team Contacts
                            syncWithGoogleSheet(false);
                        } else if (!lastKnown) {
                            localStorage.setItem(LS_LAST_HIST_ID, latestContactUpdate.id);
                        }
                    }
                }
            } catch(e) {}
        }, 20000);

        window.addEventListener('focus', () => {
            syncWithGoogleSheet(false);
        });

        function getInitials(name) {
            if (!name) return '';
            return name.substring(0, 1).toUpperCase();
        }

        function toTitleCase(str) {
            if (!str) return '';
            return str.toLowerCase().split(' ').map(word => {
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function renderContacts(data) {
            const grid = document.getElementById('contactGrid');
            grid.innerHTML = '';
            
            const overrides = JSON.parse(localStorage.getItem('tabreed_contacts_override')) || {};
            
            data.forEach(emp => {
                // Apply overrides if exist
                if (overrides[emp.code]) {
                    emp.phone = overrides[emp.code].phone || emp.phone;
                    emp.whatsapp = overrides[emp.code].whatsapp || emp.whatsapp;
                    emp.email = overrides[emp.code].email || emp.email;
                }

                const cleanPhone = emp.phone ? emp.phone.replace(/[^0-9+]/g, '') : '';
                const cleanWhatsapp = emp.whatsapp ? emp.whatsapp.replace(/[^0-9+]/g, '') : '';
                
                const displayName = toTitleCase(emp.full);
                const shortName = toTitleCase(emp.short);

                const card = document.createElement('div');
                card.className = 'contact-card';
                card.innerHTML = `
                    <div class="contact-header">
                        <div class="contact-avatar-wrapper" onclick="openEditModal('${emp.code}')" title="Edit Contact">
                            <div class="contact-avatar">${getInitials(shortName)}</div>
                            <div class="avatar-edit-overlay"><i class="fas fa-pen" style="font-size:1rem;"></i></div>
                        </div>
                        <div class="contact-info">
                            <h3 class="contact-name" title="${displayName}">${displayName}</h3>
                            <div class="contact-role">Employee ID: ${emp.code} ${emp.role ? `• ${emp.role}` : ''}</div>
                        </div>
                    </div>
                    <div class="contact-details">
                        ${emp.phone ? `
                        <div class="detail-row">
                            <i class="fas fa-phone detail-icon"></i>
                            <span class="detail-text">${emp.phone}</span>
                        </div>
                        ` : ''}
                        ${emp.whatsapp ? `
                        <div class="detail-row">
                            <i class="fab fa-whatsapp detail-icon" style="color:#25D366;"></i>
                            <span class="detail-text">${emp.whatsapp}</span>
                        </div>
                        ` : ''}
                        ${emp.email ? `
                        <div class="detail-row">
                            <i class="fas fa-envelope detail-icon"></i>
                            <span class="detail-text">${emp.email}</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="contact-actions">
                        ${emp.phone && emp.phone !== '0000000000' ? `<a href="tel:${cleanPhone}" class="action-btn btn-call"><i class="fas fa-phone-alt"></i> Call</a>` : ''}
                        ${emp.whatsapp && emp.whatsapp !== '0000000000' ? `<div style="display:flex;gap:0.5rem;flex:1;"><a href="tel:${cleanWhatsapp}" class="action-btn btn-call" style="flex:1;background:var(--primary);color:white;" title="Call via WhatsApp Number"><i class="fas fa-phone-alt"></i></a><a href="https://wa.me/${cleanWhatsapp}" target="_blank" class="action-btn btn-chat" style="flex:1;" title="Chat via WhatsApp"><i class="fab fa-whatsapp"></i></a></div>` : ''}
                        ${emp.email ? `<a href="mailto:${emp.email}" class="action-btn btn-email"><i class="fas fa-envelope"></i> Email</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterContacts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = EMPLOYEES.filter(emp => 
                emp.full.toLowerCase().includes(term) || 
                emp.short.toLowerCase().includes(term) || 
                emp.code.includes(term) || 
                (emp.email && emp.email.toLowerCase().includes(term))
            );
            renderContacts(filtered);
        }
    </script>
<div class="toast-container pos-bottom" id="toastContainer"></div>
</body>
</html>
