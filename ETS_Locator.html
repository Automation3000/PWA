        /* ═══════════════════════════════════════════════════
           DARK MODE — Carefully designed for readability
        ═══════════════════════════════════════════════════ */
        

        body.theme-ocean-blue {

            --primary-dark:   #0369a1;

        }

        body.theme-industrial {

        }

        body.theme-emerald-forest {
            --primary:        #059669;
            --primary-dark:   #047857;
            --primary-light:  #d1fae5;
            --header-bg:      #064e3b;
            --bg-page:        #f0fdf4;

        body.theme-royal-purple {
            --primary:        #7c3aed;

            --bg-page:        #faf5ff;
        }

        body.theme-crimson-red {
            --primary:        #dc2626;
            --primary-dark:   #b91c1c;
            --primary-light:  #fee2e2;
            --header-bg:      #7f1d1d;
            --bg-page:        #fef2f2;

        body.theme-nordic-teal {
            --primary:        #0d9488;

        body.theme-slate-minimal {
            --primary:        #475569;
            --primary-dark:   #334155;
            --primary-light:  #f1f5f9;
            --header-bg:      #0f172a;

        }

        body.theme-cyber-dark {
            --primary:        #22d3ee;
            --primary-dark:   #0891b2;
            --primary-light:  #164e63;
            --secondary:      #34d399;
            --warning:        #facc15;
            --danger:         #f87171;

            --light:          #1f2937;
            --gray:           #9ca3af;

            --bg-card:        #1e293b;

            --text-secondary: #cbd5e1;
            --text-muted:     #94a3b8;

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color .3s, color .3s;
        }

        .app-container { max-width: 1200px; margin: 0 auto; padding: 0 15px 15px 15px; }

        /* HEADER */
        .app-header {
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background .3s, box-shadow .3s;
            margin: 0 -15px 15px -15px;
        }
        @media (min-width: 1200px) {
            .app-header { margin: 0 0 15px 0; }
        }
        .header-content { display:flex; align-items:center; justify-content:space-between; }
        .brand { display:flex; align-items:center; gap:.75rem; }
        
        /* SEARCH & FILTER */
        .search-container { padding:1rem; margin-bottom:1rem; background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border); }
        .search-box { position:relative; }
        .search-box input {
            width:100%; padding:.8rem 1rem .8rem 3rem;
            border:1.5px solid var(--border); border-radius:var(--radius-sm);
            font-size:16px; background:var(--input-bg); color:var(--text-primary);
            outline:none; transition:border-color .2s;
        }
        .search-box input:focus     { border-color:var(--primary); }
        .search-box input::placeholder { color:var(--text-muted); opacity:1; }
        .search-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--text-muted); }

        /* QUICK ACTIONS */
        .quick-actions { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; justify-content:center; }
        .action-btn {
            background:var(--bg-card); border:1.5px solid var(--border);
            flex:1; min-width:70px; max-width:110px;
            padding:.8rem .4rem; border-radius:var(--radius);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-size:.7rem; font-weight:700; color:var(--text-primary);
            box-shadow:var(--shadow-sm); cursor:pointer; transition:var(--transition);
            position:relative;
        }
        .action-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--primary); }
        .action-btn span  { color:var(--text-secondary); font-size:.65rem; text-align:center; margin-top:3px; }
        .filter-active { background:var(--primary-light) !important; border-color:var(--primary) !important; }
        .filter-active i, .filter-active span { color:var(--primary) !important; }
        .select-wrapper { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        .action-content { pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; }

        /* TABLE */
        .card-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; font-size: .85rem; border-bottom: 1px solid var(--border); }
        th { background: var(--table-header); color: var(--text-secondary); text-transform: uppercase; letter-spacing: .3px; font-weight: 700; white-space: nowrap; }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background-color .15s; }
        tbody tr:hover { background: var(--bg-surface); }

        /* TAGS & BADGES */
        .location-tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: .75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .note-badge {
            font-size: 10px;
            background: var(--warning);
            color: #000;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        /* BUTTONS */
        /* BUTTONS */
        .btn-dir {
            background: #1a73e8; /* Google Maps Blue */
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: .8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(26, 115, 232, 0.2);
        }
        .btn-dir:hover { background: #1557b0; color: #ffffff; }
        .btn-dir i { font-size: 0.85rem; }
        .btn-dir span { font-weight: 600; }
        
        .btn-edit {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: .8rem;
            display: none; /* Hidden by default, shown when Action eye icon is toggled */
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger, #ef4444);
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: .8rem;
            display: none; /* Hidden by default, shown when Action eye icon is toggled and Developer is logged in */
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-delete:hover {
            background: var(--danger, #ef4444);
            color: #ffffff;
            border-color: var(--danger, #ef4444);
        }
        .show-edit-btn .btn-edit, .show-all-edits .btn-edit,
        .show-edit-btn .btn-delete, .show-all-edits .btn-delete {
            display: inline-flex !important;
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .btn-edit:hover { border-color: var(--primary); color: var(--primary); }
        .actions-icon:hover { color: var(--primary) !important; }

        /* Column Styles (Desktop) */
        .col-plant {
            width: 22%;
            min-width: 95px;
        }
        .col-ets {
            min-width: 140px;
            font-weight: 700;
            color: var(--primary);
        }
        .col-coords {
            min-width: 155px;
            text-align: center;
            white-space: nowrap;
        }
        .col-actions {
            text-align: right;
            white-space: nowrap;
            min-width: 165px;
            width: 175px;
        }
        .action-btn-group {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }
        .ets-mobile-line {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ets-name-box {
            min-width: 0;
        }
        .ets-name-text {
            font-weight: 700;
            color: var(--primary);
        }

        /* Plant Mobile Badge Default */
        .badge-plant-mobile {
            display: none;
            font-size: 0.68rem;
            font-weight: 700;
            background: var(--primary-light, #e0f2fe);
            color: var(--primary, #0284c7);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(2, 132, 199, 0.25);
            vertical-align: middle;
            align-items: center;
        }

        /* Mobile Responsive Viewport - One Page Without Side Scroll */
        @media (max-width: 768px) {
            .card-container {
                margin-left: 0 !important;
                margin-right: 0 !important;
                border-radius: var(--radius-sm) !important;
            }
            .table-responsive {
                overflow-x: hidden !important;
                width: 100% !important;
            }
            table {
                width: 100% !important;
                table-layout: fixed !important;
            }
            th, td {
                padding: 10px 8px !important;
            }
            .col-plant, .col-coords {
                display: none !important;
            }
            .col-ets {
                width: auto !important;
                min-width: 0 !important;
                padding-left: 10px !important;
                padding-right: 6px !important;
            }
            .col-actions {
                width: 140px !important;
                min-width: 140px !important;
                max-width: 140px !important;
                padding-left: 4px !important;
                padding-right: 8px !important;
                text-align: right !important;
            }
            body.is-dev-user .col-actions {
                width: 172px !important;
                min-width: 172px !important;
                max-width: 172px !important;
            }
            .action-btn-group {
                display: inline-flex !important;
                width: 100% !important;
                gap: 5px !important;
                justify-content: flex-end !important;
                align-items: center !important;
                flex-shrink: 0 !important;
                white-space: nowrap !important;
            }
            .btn-dir {
                padding: 6px 10px !important;
                font-size: 0.78rem !important;
                border-radius: 6px !important;
                gap: 5px !important;
                flex-shrink: 0 !important;
                display: inline-flex !important;
                align-items: center !important;
                box-shadow: 0 1px 3px rgba(26,115,232,0.3) !important;
                background: #1a73e8 !important;
                color: #ffffff !important;
                transition: transform 0.2s ease, background 0.2s ease !important;
            }
            .btn-dir span {
                display: inline !important;
                font-weight: 600 !important;
            }
            .btn-dir i {
                font-size: 0.82rem !important;
            }
            .btn-edit, .btn-delete {
                padding: 6px 8px !important;
                font-size: 0.78rem !important;
                flex-shrink: 0 !important;
            }
            .badge-plant-mobile {
                display: inline-flex !important;
                white-space: nowrap !important;
                flex-shrink: 0 !important;
                font-size: 0.68rem !important;
                font-weight: 700 !important;
                padding: 2px 6px !important;
                line-height: 1.2 !important;
                border-radius: 4px !important;
                background: var(--primary-light, #e0f2fe) !important;
                color: var(--primary, #0284c7) !important;
                border: 1px solid rgba(2, 132, 199, 0.25) !important;
            }
            .ets-mobile-line {
                display: flex !important;
                align-items: center !important;
                flex-wrap: nowrap !important;
                gap: 6px !important;
                min-width: 0 !important;
                max-width: 100% !important;
                overflow: hidden !important;
            }
            .ets-name-box {
                min-width: 0 !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                white-space: nowrap !important;
                flex: 1 !important;
            }
            .ets-name-text {
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                font-size: 0.86rem !important;
                display: inline-block !important;
                max-width: 100% !important;
                vertical-align: middle !important;
            }
        }

        /* Coordinates Column */
        .col-coords {
            white-space: nowrap;
            text-align: center;
            color: var(--text-secondary);
        }
        .coords-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: monospace, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }
        .coords-badge:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light, rgba(37,99,235,0.08));
        }
        .coords-masked {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-family: monospace, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px dashed var(--border);
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }
        .coords-masked:hover {
            color: var(--primary);
            border-color: var(--primary);
        }
        .coords-icon {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 2px;
            transition: color .2s;
        }
        .coords-icon:hover { color: var(--primary); }
        .coords-icon:hover { color: var(--primary); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 2000; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            animation: modalIn .3s cubic-bezier(.175,.885,.32,1.275);
            display: flex;
            flex-direction: column;
        }
        @keyframes modalIn { 0%{opacity:0;transform:scale(0.9);} 100%{opacity:1;transform:scale(1);} }
        .modal-header {
            padding: 15px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: var(--text-primary);
        }
        .modal-close {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            color: var(--text-muted); transition: color .2s;
        }
        .modal-close:hover { color: var(--danger); }
        .modal-body { padding: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: .9rem;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .modal-footer {
            padding: 12px 15px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: var(--bg-surface);
        }
        
        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            font-size: .85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .btn-action:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* ANIMATIONS */
        @keyframes popBounce { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
        .pop-anim { animation:popBounce .35s cubic-bezier(.175,.885,.32,1.275); }
        @keyframes subtlePop { 0%{opacity:0.75;transform:scale(0.995);} 100%{opacity:1;transform:scale(1);} }
        .subtle-pop-anim { animation:subtlePop .22s ease-out; }
        
        .connection-status {
            display:flex; align-items:center; gap:.4rem;
            font-size:.75rem; padding:5px 12px; border-radius:20px;
            font-weight:700; letter-spacing:.3px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
        }
        .connection-status:hover { border-color: var(--primary); }
        .status-dot { width:7px; height:7px; border-radius:50%; background:var(--warning); }
        .status-dot.online  { background:var(--secondary); animation:none; }
        .status-dot.offline { background:var(--danger); animation:none; }
        .status-dot.loading { animation:pulse-dot 1.5s infinite; }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }
        
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--dark); color: #fff; padding: 12px 24px; border-radius: 8px;
            font-size: 0.9rem; font-weight: 500; box-shadow: var(--shadow-md); z-index: 9999;
            opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>

        <header class="app-header">
            <div class="header-content">
                <div class="brand">
                    <button onclick="window.location.href='index.html'" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--primary);padding-right:10px;" title="Back">

    <script>

        const THEME_KEY = 'tabreed_selected_theme';
        const LS_DARK = 'tabreed_dark_mode';

        function applyUserSettings(settings) {
            document.body.classList.remove('toast-minimal', 'toast-glassy', 'toast-outlined', 'toast-neon', 'toast-soft-shadow', 'toast-solid');
            if (settings && settings.toastStyle && settings.toastStyle !== 'default') {
                document.body.classList.add('toast-' + settings.toastStyle);
            }
            const container = document.getElementById('toastContainer');
            if (container) {
                container.className = 'toast-container ' + (settings && settings.toastPosition ? settings.toastPosition : 'pos-top');
            }
        }
        
        function loadCurrentUserAndSettings() {
            try {
                const curUserStr = localStorage.getItem('tabreed_currentUser');
                if (curUserStr) {
                    const curUser = JSON.parse(curUserStr);
                    const code = curUser.code || curUser.empId;
                    if (code) {
                        const settingsStr = localStorage.getItem('tabreed_settings_' + code);
                        if (settingsStr) {
                            applyUserSettings(JSON.parse(settingsStr));
                        }
                    }
                }
            } catch(e){}
        }
        
        document.addEventListener('DOMContentLoaded', loadCurrentUserAndSettings);

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const t = document.createElement('div');
            t.className = 'toast';
            const colors = { success:'var(--secondary)', error:'var(--danger)', warning:'var(--warning)', info:'var(--primary)' };
            const icons  = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
            const safeMsg = msg ? String(msg).replace(/[<>"'&]/g, c => ({ '<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;' }[c])) : '';
            t.innerHTML  = `<i class="fas ${icons[type]||icons.info}" style="color:${colors[type]||colors.info};font-size:1.1rem;flex-shrink:0;"></i><span>${safeMsg}</span>`;
            container.appendChild(t);
            setTimeout(() => { t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),320); }, 2600);
        }
    
        const ALL_THEME_CLASSES = [
            'dark-mode', 'theme-ocean-blue', 'theme-industrial',
            'theme-emerald-forest', 'theme-royal-purple', 'theme-crimson-red',
            'theme-nordic-teal', 'theme-slate-minimal', 'theme-cyber-dark'
        ];

        function applyTheme() {
            const themeId = localStorage.getItem(THEME_KEY) || (localStorage.getItem(LS_DARK) === '1' ? 'dark-mode' : 'default');
            document.body.classList.remove(...ALL_THEME_CLASSES);
            if (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark') {
                document.body.classList.add('dark-mode');
            }
            if (themeId && themeId !== 'default') {
                if (themeId !== 'dark-mode') {
                    const finalTheme = themeId.startsWith('theme-') ? themeId : `theme-${themeId}`;
                    document.body.classList.add(finalTheme);
                }
            }
            const isDark = (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark');
            const icon = document.getElementById('darkModeToggleBtn');
            if (icon) {
                icon.className  = isDark ? 'fas fa-sun' : 'fas fa-moon';
                icon.style.color = isDark ? '#fdd663' : '#94a3b8';
            }
        }

        applyTheme();
        function toggleDarkMode() {
            const isCurrentlyDark = document.body.classList.contains('dark-mode');
            const newTheme = isCurrentlyDark ? 'default' : 'dark-mode';
            localStorage.setItem(LS_DARK, isCurrentlyDark ? '0' : '1');
            localStorage.setItem(THEME_KEY, newTheme);
            applyTheme();
        }

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwtbDjkB35lpSHZAN40I6voWUbQHHGVZo9LHtfah_y3IZO149gJgeY33K-98MqxBeGc1g/exec";
        
        let EMPLOYEES = [];

        const SUPER_ADMIN_CODE = "41764";
        const ADMIN_EMPLOYEE_CODES = ["41764", "40311", "40334", "40414", "40528", "40659", "40663", "41380", "41383", "41600", "41806"];

        function getEmployeeRole(empCode) {
            if (empCode === SUPER_ADMIN_CODE) return "super_admin";
            if (ADMIN_EMPLOYEE_CODES.includes(empCode)) return "admin";
            return "user";
        }

        function isDeveloper(user = currentAdminUser) {
            if (!user) return false;
            const role = (user.role || '').toLowerCase();
            const code = (user.code || user.id || user.empId || '').toString();
            const name = (user.name || user.short || user.full || '').toLowerCase();
            const isMajeed = code === SUPER_ADMIN_CODE || name.includes('majeed');
            return isMajeed && (role === 'developer' || role === 'super_admin');
        }

        function isUserAdmin(user = currentAdminUser) {
            if (!user) return false;
            const role = (user.role || '').toLowerCase();
            return role === 'admin' || role === 'super_admin' || role === 'developer';
        }

        function isSuperAdmin(user = currentAdminUser) {
            return isDeveloper(user);
        }

        let isAdminModeActive = false;
        let currentAdminUser = null;

        function isTimebaseCode(clean, prefixCode) {
            if (!clean || !clean.startsWith(prefixCode) || clean.length <= prefixCode.length) return false;
            const timePart = clean.substring(prefixCode.length);
            const now = new Date();

            for (let offset = -10; offset <= 10; offset++) {
                const targetMs = now.getTime() + offset * 60000;
                const dLocal = new Date(targetMs);
                
                // UAE Time (UTC+4) calculation
                const uaeMs = targetMs + (dLocal.getTimezoneOffset() * 60000) + (4 * 3600000);
                const dUae = new Date(uaeMs);

                for (const d of [dLocal, dUae]) {
                    const h24 = d.getHours();
                    const m = d.getMinutes();
                    const h12 = h24 % 12 || 12;

                    const mm = String(m).padStart(2, '0');
                    const hh24 = String(h24).padStart(2, '0');
                    const h24Str = String(h24);
                    const hh12 = String(h12).padStart(2, '0');
                    const h12Str = String(h12);

                    const validPatterns = [
                        `${hh24}${mm}`,
                        `${h24Str}${mm}`,
                        `${hh12}${mm}`,
                        `${h12Str}${mm}`
                    ];

                    if (validPatterns.includes(timePart)) {
                        return true;
                    }
                }
            }
            return false;
        }

                return { code: "41764", full: "ABDUL MAJEED ABDUL HAFEEZ ANSARI", short: "Majeed", role: "super_admin" };

            // Time-based check for Supervisor (40078)

                const bibin = EMPLOYEES.find(e => e.code === "40078") || { code: "40078", full: "BIBIN IPE ABRAHAM", short: "Bibin" };
                return { ...bibin, role: "supervisor" };
            }

            // Time-based check for Super Admin Majeed (41764)
            if (isTimebaseCode(clean, "41764")) {
                const majeed = EMPLOYEES.find(e => e.code === "41764") || { code: "41764", full: "ABDUL MAJEED ABDUL HAFEEZ ANSARI", short: "Majeed" };
                return { ...majeed, role: "super_admin" };
            }

            // Pure Employee Code check: ALWAYS logs in as normal "user"
            for (const emp of EMPLOYEES) {
                if (clean === emp.code) {
                    return { ...emp, role: "user" };
                }
            }

            return null;
        }

        function requestAdminPassword(callback) {

                    style="width:100%;padding:10px;margin-bottom:14px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;outline:none;text-align:center;background:var(--bg-page);color:var(--text-primary);">

            const input = overlay.querySelector('#adminPassInput');
            input.focus();
            const close   = () => { if (document.body.contains(overlay)) document.body.removeChild(overlay); };
            const submit  = () => { const v = input.value; close(); callback(v); };
            const closeBtn = overlay.querySelector('#adminPassCloseBtn');
            if (closeBtn) closeBtn.onclick = close;
            overlay.querySelector('#adminPassCancel').onclick = close;
            overlay.querySelector('#adminPassSubmit').onclick = submit;
            input.addEventListener('keypress', e => { if (e.key === 'Enter') submit(); });
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
        }

        window.addEventListener('offline', () => updateStatus('offline'));

        window.addEventListener('focus', () => { if (navigator.onLine) processSyncQueue(); });

        function updateStatus(state) {
            const el = document.getElementById('connectionStatus');
            if(el) {
                el.classList.add('pop-anim');
                setTimeout(() => el.classList.remove('pop-anim'), 350);
            }
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if(!dot) return;
            dot.className = 'status-dot';
            if (state === 'online') { 
                dot.classList.add('online'); 
                dot.style.background = '#16a34a'; 
                dot.title = 'Connection: Online (Cloud Synced)';
                if (text) text.textContent = 'Online'; 
            } else if (state === 'offline') { 
                dot.classList.add('offline'); 
                dot.style.background = '#ef4444'; 
                dot.title = 'Connection: Offline';
                if (text) text.textContent = 'Offline'; 
            } else if (state === 'cached' || state === 'syncing') { 
                dot.classList.add('loading'); 
                dot.style.background = '#eab308'; 
                dot.title = 'Connection: Cached / Syncing';
                if (text) text.textContent = state === 'cached' ? 'Cached' : 'Syncing…'; 
            } else { 
                dot.classList.add('loading'); 
                dot.style.background = '#eab308'; 
                dot.title = 'Connection: Wait…';
                if (text) text.textContent = 'Wait…'; 
            }
            updateQueueBadge();
        }

        function updateQueueBadge() {
            const badge = document.getElementById('queue-badge');
            if(!badge) return;
            if (syncQueue.length > 0) {
                badge.style.display = 'inline-block';
                badge.textContent = syncQueue.length + ' pending';
            } else {
                badge.style.display = 'none';
            }
        }

        function processSyncQueue() {
            if (!navigator.onLine || syncQueue.length === 0) return;
            updateStatus('loading');
            
            const payload = syncQueue[0];
            fetch(GAS_API_URL, {
                method: "POST",
                redirect: "follow", 
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    syncQueue.shift();
                    localStorage.setItem('tabreed_ets_queue', JSON.stringify(syncQueue));
                    if(syncQueue.length > 0) {
                        setTimeout(processSyncQueue, 1000);
                    } else {
                        updateStatus('online');
                        showToast("Offline data synced successfully!");
                        refreshTable(false);
                    }
                } else {
                    updateStatus('offline');
                }
            })
            .catch(err => {
                console.error("Sync error:", err);
                updateStatus('offline');
            });
        }
        
        function syncData() {
            if(navigator.onLine) {
                refreshTable(true);
                processSyncQueue();
            } else {
                showToast("You are offline. Data is served from cache.");
            }
        }

        function refreshTable(showAnim = true) {
            if(showAnim) {
                const btn = document.getElementById('btn-refresh');
                if (btn) {
                    btn.classList.add('pop-anim');
                    setTimeout(() => btn.classList.remove('pop-anim'), 350);
                }
            }
            
            const cachedData = localStorage.getItem('tabreed_ets_cache');
            if (cachedData) {
                etsList = JSON.parse(cachedData);
                populateLocationFilter();
                renderTable(etsList);
                if (!navigator.onLine) {
                    updateStatus('cached');
                    if(showAnim) showToast('Loaded from offline cache');
                    return;
                }
            } else {
                document.getElementById('etsTableBody').innerHTML = `<tr><td colspan="3" style="text-align:center;padding:30px;color:var(--text-muted);"><i class="fas fa-circle-notch fa-spin"></i> Loading Data from Cloud...</td></tr>`;
            }

            if (!navigator.onLine) return;
            updateStatus('loading');

            fetch(GAS_API_URL + "?action=read", { redirect: "follow" })
                .then(response => response.json())
                .then(result => {
                    if(result.status === 'success') {
                        etsList = result.data;
                        localStorage.setItem('tabreed_ets_cache', JSON.stringify(etsList));
                        document.getElementById('searchInput').value = '';
                        populateLocationFilter();
                        renderTable(etsList);
                        updateStatus('online');
                        if(showAnim) showToast('Data refreshed successfully');
                    } else {
                        throw new Error(result.message);
                    }
                })
                .catch(error => {
                    console.error("Fetch error:", error);
                    updateStatus(cachedData ? 'cached' : 'offline');
                    if(showAnim) showToast('Failed to load live data. Working offline.');
                });
        }

        function populateLocationFilter() {
            const select = document.getElementById('locationFilter');
            if (!select) return;
            const currentSelected = select.value || 'ALL';
            
            const plantSet = new Set();
            (etsList || []).forEach(item => {
                if (item && item.plant) {
                    const p = item.plant.toString().trim();
                    if (p) plantSet.add(p);
                }
            });
            const uniquePlants = Array.from(plantSet).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
            
            let html = `<option value="ALL">All Plants</option>`;
            uniquePlants.forEach(p => {
                html += `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`;
            });
            select.innerHTML = html;

            if (uniquePlants.includes(currentSelected)) {
                select.value = currentSelected;
            } else {
                select.value = 'ALL';
            }

            const labelEl = document.getElementById('label-location');
            if (labelEl) {
                labelEl.innerText = select.value === 'ALL' ? 'All Plants' : select.value;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('etsTableBody');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text-muted);">No ETS locations found.</td></tr>`;
                return;
            }

            const isDev = isDeveloper();

            tbody.innerHTML = data.map((item, idx) => {
                const commentText = (item.comment || '').trim();
                const hasComment = commentText.length > 0;
                
                // If there's a comment, make the name clickable and add a small icon. Otherwise just show the name.
                const nameDisplay = hasComment 
                    ? `<span class="ets-name-text" style="cursor:pointer;" onclick="showComment(${item.rowIdx})">${escapeHtml(item.name)} <i class="fas fa-sticky-note" style="color:#FFC107; margin-left:3px; font-size:0.85rem;" title="View Note"></i></span>` 
                    : `<span class="ets-name-text">${escapeHtml(item.name)}</span>`;
                
                // Ensure plantName doesn't default to N/A if it just happens to be a falsy string, checking against undefined/null
                const plantName = (item.plant !== undefined && item.plant !== null && item.plant !== "") ? item.plant.toString().trim() : "N/A";

                const coordsFormatted = (item.lat !== undefined && item.lng !== undefined && item.lat !== '' && item.lng !== '')
                    ? `${item.lat}, ${item.lng}`
                    : '';

                const hasValidCoords = (item.lat !== undefined && item.lng !== undefined && item.lat !== '' && item.lng !== '' && !isNaN(Number(item.lat)) && !isNaN(Number(item.lng)));
                const dirUrl = hasValidCoords ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.lat + ',' + item.lng)}` : '#';
                const dirOnClick = hasValidCoords ? '' : `onclick="showToast('GPS coordinates not available', 'error'); return false;"`;

                const deleteBtn = isDev ? `
                    <button onclick="deleteETS(${item.rowIdx}, '${escapeHtml(item.name).replace(/'/g, "\\'")}')" class="btn-delete" title="Delete Entry (Developer Only)">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                ` : '';

                return `<tr class="ets-row" onmousedown="handlePressStart(this)" onmouseup="handlePressEnd()" onmouseleave="handlePressEnd()" ontouchstart="handlePressStart(this)" ontouchend="handlePressEnd()" ontouchcancel="handlePressEnd()" ontouchmove="handlePressEnd()">
                    <td class="col-plant">
                        <div style="font-weight:600; color:var(--text-primary); margin-bottom:4px;">${escapeHtml(plantName)}</div>
                    </td>
                    <td class="col-ets">
                        <div class="ets-mobile-line">
                            <span class="badge-plant-mobile" title="${escapeHtml(plantName)}">${escapeHtml(plantName)}</span>
                            <div class="ets-name-box" title="${escapeHtml(item.name)}">
                                ${nameDisplay}
                            </div>
                        </div>
                    </td>
                    <td class="col-coords" style="text-align:center; white-space:nowrap; display:${isDev ? '' : 'none'};">
                        <span class="coords-badge" onclick="copyCoords('${coordsFormatted}')" style="display:${(isDev && showCoords) ? 'inline-flex' : 'none'};" title="Click to copy GPS coordinates">
                            <i class="fas fa-crosshairs" style="color:var(--primary); font-size:0.75rem;"></i>
                            <span>${coordsFormatted || 'N/A'}</span>
                        </span>
                        <span class="coords-masked" onclick="toggleCoords()" style="display:${(isDev && !showCoords) ? 'inline-flex' : 'none'};" title="Click to reveal GPS coordinates">
                            <i class="fas fa-eye-slash" style="opacity:0.4; font-size:0.75rem;"></i>
                            <span style="letter-spacing:2px; opacity:0.4; font-family:monospace; font-size:0.75rem;">••••••••</span>
                        </span>
                    </td>
                    <td class="col-actions">
                        <div class="action-btn-group">
                            <a href="${dirUrl}" ${dirOnClick} target="_blank" class="btn-dir" title="Direction on Google Maps">
                                <i class="fas fa-directions"></i> <span>Direction</span>
                            </a>
                            <button onclick="openUpdateModal(${item.rowIdx})" class="btn-edit" title="Edit ETS">
                                <i class="fas fa-edit"></i>
                            </button>
                            ${deleteBtn}
                        </div>
                    </td>
                </tr>`;
            }).join('');
            
            applyCoordsState();

            const tableEl = document.querySelector('.card-container');
            if (tableEl) {
                tableEl.classList.remove('subtle-pop-anim');
                void tableEl.offsetWidth;
                tableEl.classList.add('subtle-pop-anim');
            }
        }

        function filterETS() {
            try {
                const searchEl = document.getElementById('searchInput');
                const query = (searchEl ? searchEl.value : '').toLowerCase().trim();
                const locationSelect = document.getElementById('locationFilter');
                const locFilter = (locationSelect ? locationSelect.value : 'ALL').trim();
                
                const labelEl = document.getElementById('label-location');
                if (labelEl && locationSelect) {
                    if (locationSelect.selectedIndex >= 0 && locationSelect.options[locationSelect.selectedIndex]) {
                        labelEl.innerText = locationSelect.options[locationSelect.selectedIndex].text;
                    } else {
                        labelEl.innerText = locFilter === 'ALL' ? 'All Plants' : locFilter;
                    }
                }

                const filtered = etsList.filter(item => {
                    if (!item) return false;
                    const nameStr = (item.name || '').toString().toLowerCase();
                    const plantStr = (item.plant || '').toString().toLowerCase();
                    const latStr = (item.lat !== undefined && item.lat !== null) ? item.lat.toString() : '';
                    const lngStr = (item.lng !== undefined && item.lng !== null) ? item.lng.toString() : '';
                    const commentStr = (item.comment || '').toString().toLowerCase();

                    const matchesQuery = !query || 
                                         nameStr.includes(query) || 
                                         plantStr.includes(query) ||
                                         latStr.includes(query) || 
                                         lngStr.includes(query) ||
                                         commentStr.includes(query);

                    const itemPlant = (item.plant || '').toString().trim().toUpperCase();
                    const targetFilter = locFilter.toUpperCase();
                    const matchesLoc = (targetFilter === 'ALL' || itemPlant === targetFilter);

                    return matchesQuery && matchesLoc;
                });
                
                renderTable(filtered);
                
                const btn = document.getElementById('btn-location-wrapper');
                if (btn) {
                    if (locFilter !== 'ALL') {
                        btn.classList.add('filter-active');
                        btn.classList.add('pop-anim');
                        setTimeout(() => btn.classList.remove('pop-anim'), 350);
                    } else {
                        btn.classList.remove('filter-active');
                    }
                }
            } catch (err) {
                console.error("Filter error:", err);
            }
        }

        function exportToExcel() {
            if (!currentAdminUser || !isSuperAdmin(currentAdminUser)) {
                showToast("Access Denied", "error");
                if (!currentAdminUser) handleAdminControlClick();
                return;
            }
            if (etsList.length === 0) { showToast("No data to export."); return; }
            const wsData = etsList.map(item => ({
                "ETS Name": item.name,
                "Plant": item.plant,
                "Coordinates": `${item.lat}, ${item.lng}`,
                "Comment": item.comment
            }));
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "ETS_Locations");
            XLSX.writeFile(wb, "ETS_Locations.xlsx");
            showToast("Excel downloaded successfully");
        }

        function exportToPDF() {
            if (!currentAdminUser || !isSuperAdmin(currentAdminUser)) {
                showToast("Access Denied", "error");
                if (!currentAdminUser) handleAdminControlClick();
                return;
            }
            if (etsList.length === 0) { showToast("No data to export."); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text("TABREED ETS Locations", 14, 20);
            
            const tableData = etsList.map(item => [
                item.name, item.plant, `${item.lat}, ${item.lng}`, item.comment || ''
            ]);
            
            doc.autoTable({
                head: [['ETS Name', 'Plant', 'Coordinates', 'Comment']],
                body: tableData,
                startY: 25,
                theme: 'grid',
                headStyles: { fillColor: [26, 115, 232] }
            });
            
            doc.save("ETS_Locations.pdf");
            showToast("PDF downloaded successfully");
        }

                </button>
                <button type="button" onclick="removeContactRow(this)" title="Remove this contact" style="width:34px; height:34px; border-radius:6px; border:1px solid rgba(239,68,68,0.4); background:rgba(239,68,68,0.1); color:#ef4444; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                    <i class="fas fa-trash-alt"></i>
                </button>
            `;
            container.appendChild(row);
            updateContactRowButtons();
            const input = row.querySelector('.ets-contact-input');
            if (input && !val) input.focus();
        }

        function removeContactRow(btn) {
            const container = document.getElementById('contactFieldsContainer');
            if (!container) return;
            const rows = container.querySelectorAll('.contact-row');
            if (rows.length > 1) {
                btn.closest('.contact-row').remove();
                updateContactRowButtons();
            } else {
                const input = rows[0].querySelector('.ets-contact-input');
                if (input) input.value = '';
            }
        }

        function updateContactRowButtons() {
            const container = document.getElementById('contactFieldsContainer');
            if (!container) return;
            const rows = container.querySelectorAll('.contact-row');
            rows.forEach(r => {
                const delBtn = r.querySelector('[title="Remove this contact"]');
                if (delBtn) delBtn.style.display = rows.length > 1 ? 'flex' : 'none';
            });
        }

        function toggleContactField() {
            const cb = document.getElementById('hasContactCb');
            const container = document.getElementById('contactFieldsContainer');
            if (!container) return;
            if (cb.checked) {
                container.style.display = 'flex';
                const rows = container.querySelectorAll('.contact-row');
                if (rows.length === 0) {
                    addContactRow('');
                }
            } else {
                container.style.display = 'none';
                container.innerHTML = '';
            }
        }

        function cleanseCoordsString(val) {
            if (!val) return '';
            // Remove brackets: (), [], {} and quotes
            let clean = val.toString().replace(/[()[\]{}"']/g, '').trim();
            // Remove "lat:" or "lng:" or direction prefixes
            clean = clean.replace(/lat:\s*/gi, '').replace(/lng:\s*/gi, '');
            // Normalize spaces around commas
            clean = clean.replace(/\s*,\s*/g, ', ');
            return clean;
        }

        function cleanseCoordsInput(inputEl) {
            if (!inputEl) return;
            const original = inputEl.value;
            const cleaned = cleanseCoordsString(original);
            if (original !== cleaned) {
                inputEl.value = cleaned;
            }
        }

        function handleCoordsPaste(event, inputEl) {
            setTimeout(() => {
                cleanseCoordsInput(inputEl);
            }, 10);
        }

        function fetchExactGPS() {
            const btn = document.getElementById('btnGetGPS');
            const icon = document.getElementById('gpsIcon');
            const badge = document.getElementById('gpsAccuracyBadge');
            const coordsInput = document.getElementById('etsCoords');
            
            if (!navigator.geolocation) {
                showToast("Geolocation is not supported by your browser.", "error");
                return;
            }
            
            if (icon) icon.className = 'fas fa-spinner fa-spin';
            if (btn) btn.disabled = true;
            if (badge) {
                badge.style.display = 'inline-block';
                badge.style.color = 'var(--text-muted)';
                badge.innerHTML = '<i class="fas fa-satellite"></i> Fetching precise GPS...';
            }
            showToast("Acquiring exact GPS coordinates...", "info");

            const options = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    if (icon) icon.className = 'fas fa-crosshairs';
                    if (btn) btn.disabled = false;
                    
                    const lat = Number(pos.coords.latitude.toFixed(6));
                    const lng = Number(pos.coords.longitude.toFixed(6));
                    const accuracy = Math.round(pos.coords.accuracy);
                    
                    coordsInput.value = `${lat}, ${lng}`;
                    cleanseCoordsInput(coordsInput);

                    if (badge) {
                        badge.style.display = 'inline-block';
                        badge.style.color = accuracy <= 20 ? '#16a34a' : '#f59e0b';
                        badge.innerHTML = `<i class="fas fa-check-circle"></i> Accuracy: ±${accuracy}m`;
                    }
                    showToast(`Exact GPS captured (±${accuracy}m accuracy)!`, "success");
                },
                (err) => {
                    if (icon) icon.className = 'fas fa-crosshairs';
                    if (btn) btn.disabled = false;
                    if (badge) {
                        badge.style.display = 'inline-block';
                        badge.style.color = '#ef4444';
                        badge.innerHTML = '<i class="fas fa-exclamation-circle"></i> GPS Error';
                    }
                    let msg = "Could not get GPS coordinates. ";
                    if (err.code === 1) msg += "Permission denied. Allow location in browser settings.";
                    else if (err.code === 2) msg += "Position unavailable. Please ensure Device GPS is ON.";
                    else if (err.code === 3) msg += "Location request timed out. Please try again.";
                    else msg += err.message;
                    showToast(msg, "error");
                },
                options
            );
        }

        async function deleteETS(rowIdx, etsName) {
            if (!isDeveloper()) {
                showToast("Access Denied: Delete option is restricted to Developers only.", "error");
                return;
            }

            const item = etsList.find(e => e.rowIdx === rowIdx);
            const targetName = etsName || (item ? item.name : `Row #${rowIdx}`);
            if (!confirm(`Are you sure you want to DELETE "${targetName}"?\n\nThis will remove the ETS location permanently.`)) {
                return;
            }

            showToast(`Deleting "${targetName}"...`);

            // Optimistically remove from local list & update UI
            etsList = etsList.filter(e => e.rowIdx !== rowIdx);
            try {
                localStorage.setItem('tabreed_ets_cache', JSON.stringify(etsList));
            } catch(e) {}
            populateLocationFilter();
            filterETS();

            const payload = {
                action: 'delete',
                data: {
                    rowIdx: rowIdx,
                    name: "",
                    plant: "",
                    coords: "",
                    comment: ""
                }
            };

            if (!navigator.onLine) {
                syncQueue.push(payload);
                localStorage.setItem('tabreed_ets_queue', JSON.stringify(syncQueue));
                updateQueueBadge();
                showToast(`"${targetName}" deleted offline. Will sync with cloud.`);
                return;
            }

            try {
                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    redirect: "follow", 
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result && result.status === 'success') {
                    showToast(`"${targetName}" deleted successfully!`);
                } else {
                    // Fallback to blank row update
                    const fallbackPayload = {
                        action: 'update',
                        data: {
                            rowIdx: rowIdx,
                            name: "",
                            plant: "",
                            coords: "",
                            comment: ""
                        }
                    };
                    await fetch(GAS_API_URL, {
                        method: "POST",
                        redirect: "follow", 
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(fallbackPayload)
                    });
                    showToast(`"${targetName}" deleted from Sheet!`);
                }
            } catch(err) {
                console.error("Delete error:", err);
                syncQueue.push(payload);
                localStorage.setItem('tabreed_ets_queue', JSON.stringify(syncQueue));
                updateQueueBadge();
                showToast(`Saved deletion offline. Will sync when cloud responds.`);
            }
        }

        function deleteFromModal() {
            const rowIdx = parseInt(document.getElementById('editRowIdx').value);
            const etsName = document.getElementById('etsName').value;
            closeModal();
            deleteETS(rowIdx, etsName);
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-map-marked-alt"></i> Add New ETS';
            document.getElementById('editRowIdx').value = '-1';
            document.getElementById('etsPlant').value = '';
            document.getElementById('etsName').value = '';
            document.getElementById('etsCoords').value = '';
            
            const badge = document.getElementById('gpsAccuracyBadge');
            if (badge) {
                badge.style.display = 'none';
                badge.innerHTML = '';
            }
            const modalDevActions = document.getElementById('modalDevActions');
            if (modalDevActions) modalDevActions.innerHTML = '';

            document.getElementById('hasContactCb').checked = false;
            toggleContactField();
            
            document.getElementById('etsComment').value = '';
            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Save ETS';
            document.getElementById('etsModal').style.display = 'flex';
        }

        function openUpdateModal(rowIdx) {
            const item = etsList.find(e => e.rowIdx === rowIdx);
            if (!item) return;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Edit ETS Location';
            document.getElementById('editRowIdx').value = rowIdx;
            document.getElementById('etsPlant').value = item.plant || '';
            document.getElementById('etsName').value = item.name || '';
            document.getElementById('etsCoords').value = (item.lat !== undefined && item.lng !== undefined && item.lat !== '' && item.lng !== '') ? `${item.lat}, ${item.lng}` : '';
            
            const badge = document.getElementById('gpsAccuracyBadge');
            if (badge) {
                badge.style.display = 'none';
                badge.innerHTML = '';
            }

            const modalDevActions = document.getElementById('modalDevActions');
            if (modalDevActions) {
                if (isDeveloper() && rowIdx > 0) {
                    modalDevActions.innerHTML = `
                        <button type="button" onclick="deleteFromModal()" style="padding:7px 12px; border-radius:var(--radius); border:1px solid rgba(239,68,68,0.4); background:rgba(239,68,68,0.1); color:#ef4444; font-weight:700; font-size:0.75rem; cursor:pointer; display:inline-flex; align-items:center; gap:5px;" title="Delete this ETS (Developer Only)">
                            <i class="fas fa-trash-alt"></i> Delete Entry
                        </button>
                    `;
                } else {
                    modalDevActions.innerHTML = '';
                }
            }

            let fullComment = item.comment || '';
            let contact = '';
            let note = fullComment;
            
            if (fullComment.startsWith("Contact: ")) {
                const splitParts = fullComment.split("\n---\n");
                contact = splitParts[0].replace("Contact: ", "").trim();
                note = splitParts.length > 1 ? splitParts.slice(1).join("\n---\n") : "";
            }
            
            const cb = document.getElementById('hasContactCb');
            const container = document.getElementById('contactFieldsContainer');
            if (container) container.innerHTML = '';

            if (contact) {
                cb.checked = true;
                container.style.display = 'flex';
                // Split multi-contacts separated by comma, newline or pipe
                const splitContacts = contact.split(/\s*(?:,|\n|\|)\s*(?=[A-Za-z0-9\+\(])/).map(s => s.trim()).filter(Boolean);
                if (splitContacts.length > 0) {
                    splitContacts.forEach(c => addContactRow(c));
                } else {
                    addContactRow(contact);
                }
            } else {
                cb.checked = false;
                if (container) container.style.display = 'none';
            }
            
            document.getElementById('etsComment').value = note;
            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-check"></i> Update ETS';
            document.getElementById('etsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('etsModal').style.display = 'none';
        }

        function saveETS() {
            const rowIdx = parseInt(document.getElementById('editRowIdx').value);
            const plant = document.getElementById('etsPlant').value.trim();
            const name = document.getElementById('etsName').value.trim();
            
            // Auto cleanse coordinates
            const rawCoords = document.getElementById('etsCoords').value;
            const coordsStr = cleanseCoordsString(rawCoords);
            document.getElementById('etsCoords').value = coordsStr;
            
            // Collect contacts from all contact input rows
            const contactInputs = document.querySelectorAll('.ets-contact-input');
            const contactList = [];
            contactInputs.forEach(inp => {
                let c = inp.value.trim();
                if (c) {
                    // Automatically convert mobile starting with 05 to +971
                    c = c.replace(/\b0 ?(5 ?\d ?\d ?\d ?\d ?\d ?\d ?\d ?\d)\b/g, match => {
                        return "+971" + match.replace(/\s/g, '').substring(1);
                    });
                    contactList.push(c);
                }
            });
            const combinedContacts = contactList.join(', ');
            const rawComment = document.getElementById('etsComment').value.trim();
            
            let finalComment = rawComment;
            if (document.getElementById('hasContactCb').checked && combinedContacts) {
                finalComment = "Contact: " + combinedContacts + (rawComment ? "\n---\n" + rawComment : "");
            }
            
            // Parse coords
            const coordsParts = coordsStr.split(',').map(s => s.trim());
            const lat = parseFloat(coordsParts[0]);
            const lng = parseFloat(coordsParts[1]);

            if (!plant || !name || isNaN(lat) || isNaN(lng)) {
                showToast("Please fill Plant, Name, and valid Coordinates (e.g. 24.452254, 54.614217).");
                return;
            }

            const coordsString = `${lat}, ${lng}`; // Normalized string for sheet

            const payload = { 
                action: rowIdx >= 0 ? 'update' : 'add', 
                data: { rowIdx: rowIdx >= 0 ? rowIdx : null, name: name, plant: plant, coords: coordsString, lat: lat, lng: lng, comment: finalComment } 
            };
            
            if (!navigator.onLine) {
                syncQueue.push(payload);
                localStorage.setItem('tabreed_ets_queue', JSON.stringify(syncQueue));
                updateQueueBadge();
                
                if(rowIdx >= 0) {
                    const idx = etsList.findIndex(e => e.rowIdx === rowIdx);
                    if(idx > -1) etsList[idx] = payload.data;
                } else {
                    payload.data.rowIdx = -Date.now(); 
                    etsList.push(payload.data);
                }
                localStorage.setItem('tabreed_ets_cache', JSON.stringify(etsList));
                renderTable(etsList);
                populateLocationFilter();
                
                showToast("Saved offline. Will sync when connection is restored.");
                closeModal();
                return;
            }

            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            document.getElementById('saveBtn').disabled = true;

            fetch(GAS_API_URL, {
                method: "POST",
                redirect: "follow", 
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    showToast(rowIdx >= 0 ? "ETS Updated Successfully!" : "New ETS Added!");
                    closeModal();
                    refreshTable(false); // reload data from server
                } else {
                    throw new Error(result.message);
                }
            })
            .catch(err => {
                console.error("Save error:", err);
                showToast("Error saving data: " + err.message);
            })
            .finally(() => {
                document.getElementById('saveBtn').disabled = false;
                document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Save ETS';
            });
        }

        function showComment(rowIdx) {
            const item = etsList.find(e => e.rowIdx === rowIdx);
            if (!item) return;
            let fullComment = item.comment || '';
            let contact = '';
            let note = fullComment;
            
            if (fullComment.startsWith("Contact: ")) {
                const splitParts = fullComment.split("\n---\n");
                contact = splitParts[0].replace("Contact: ", "").trim();
                note = splitParts.length > 1 ? splitParts.slice(1).join("\n---\n") : "";
            }

            let html = '';
            if (contact) {
                // Split multi contacts by comma, newline or pipe
                const contactEntries = contact.split(/\s*(?:,|\n|\|)\s*(?=[A-Za-z0-9\+\(])/).map(s => s.trim()).filter(Boolean);
                if (contactEntries.length === 0) contactEntries.push(contact);

                html += `<div style="margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border);">
                            <strong style="color:var(--text-primary);"><i class="fas fa-user-circle" style="color:var(--primary); margin-right:5px;"></i> Contact Person:</strong><br>`;

                contactEntries.forEach(singleContact => {
                    let formattedContact = singleContact.replace(/\b0(5\d{8})\b/g, "+971$1");
                    let callBtnHtml = '';
                    const phoneMatch = formattedContact.match(/\+9715\d{8}/);
                    if (phoneMatch) {
                        callBtnHtml = `<a href="tel:${phoneMatch[0]}" style="display:inline-flex; align-items:center; gap:4px; margin-left:8px; background:#16a34a; color:white; padding:3px 8px; border-radius:12px; text-decoration:none; font-size:0.75rem; font-weight:bold;"><i class="fas fa-phone-alt"></i> Call</a>`;
                    }
                    html += `<div style="color:var(--text-secondary); margin-top:6px; display:flex; align-items:center; justify-content:space-between; background:var(--bg-card); padding:8px 10px; border-radius:6px; border:1px solid var(--border);">
                                <span>${escapeHtml(formattedContact)}</span>
                                ${callBtnHtml}
                             </div>`;
                });

                html += `</div>`;
            }
            if (note) {
                html += `<div>
                            <strong style="color:var(--text-primary);"><i class="fas fa-sticky-note" style="color:#FFC107; margin-right:5px;"></i> Note:</strong><br>
                            <span style="color:var(--text-secondary); white-space:pre-wrap; display:inline-block; margin-top:4px;">${escapeHtml(note)}</span>
                         </div>`;
            } else if (!contact && !note) {
                html = `<span style="color:var(--text-muted);">No notes available.</span>`;
            }

            document.getElementById('commentTextDisplay').innerHTML = html;
            document.getElementById('commentModal').style.display = 'flex';
        }

        function closeCommentModal() {
            document.getElementById('commentModal').style.display = 'none';
        }

        // Global ESC key listener to close active popups / modals
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27) {
                const passCloseBtn = document.getElementById('adminPassCloseBtn') || document.getElementById('adminPassCancel');
                if (passCloseBtn && document.getElementById('adminPassInput')) {
                    passCloseBtn.click();
                    return;
                }
                const commentModal = document.getElementById('commentModal');
                if (commentModal && commentModal.style.display === 'flex') {
                    closeCommentModal();
                    return;
                }
                const etsModal = document.getElementById('etsModal');
                if (etsModal && etsModal.style.display === 'flex') {
                    closeModal();
                    return;
                }
                const statsModal = document.getElementById('statsModal');
                if (statsModal && statsModal.style.display === 'flex') {
                    closeStatsModal();
                    return;
                }
                const adminModal = document.getElementById('adminModal');
                if (adminModal && adminModal.style.display === 'flex') {
                    closeAdminModal();
                    return;
                }
            }
        });

        

        function escapeHtml(str) {
            return str ? str.toString().replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            ) : '';
        }
    </script>
<div class="toast-container" id="toastContainer"></div>
</body>
</html>
