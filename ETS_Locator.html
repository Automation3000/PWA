<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TABREED | ETS Locator</title>
    
    <meta name="theme-color" content="#1a2935">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        

        /* ═══════════════════════════════════════════════════
           DARK MODE — Carefully designed for readability
        ═══════════════════════════════════════════════════ */
        

        body.theme-ocean-blue {
            --primary:        #0284c7;
            --primary-dark:   #0369a1;
            --primary-light:  #e0f2fe;
            --header-bg:      #0c4a6e;
            --bg-page:        #f0f9ff;
        }

        body.theme-industrial {
            --primary:        #d97706;
            --primary-dark:   #b45309;
            --primary-light:  #fef3c7;
            --header-bg:      #1f2937;
            --bg-page:        #fffbeb;
        }

        body.theme-emerald-forest {
            --primary:        #059669;
            --primary-dark:   #047857;
            --primary-light:  #d1fae5;
            --header-bg:      #064e3b;
            --bg-page:        #f0fdf4;
        }

        body.theme-royal-purple {
            --primary:        #7c3aed;
            --primary-dark:   #6d28d9;
            --primary-light:  #ede9fe;
            --header-bg:      #4c1d95;
            --bg-page:        #faf5ff;
        }

        body.theme-crimson-red {
            --primary:        #dc2626;
            --primary-dark:   #b91c1c;
            --primary-light:  #fee2e2;
            --header-bg:      #7f1d1d;
            --bg-page:        #fef2f2;
        }

        body.theme-nordic-teal {
            --primary:        #0d9488;
            --primary-dark:   #0f766e;
            --primary-light:  #ccfbf1;
            --header-bg:      #134e4a;
            --bg-page:        #f0fdfa;
        }

        body.theme-slate-minimal {
            --primary:        #475569;
            --primary-dark:   #334155;
            --primary-light:  #f1f5f9;
            --header-bg:      #0f172a;
            --bg-page:        #f8fafc;
        }

        body.theme-cyber-dark {
            --primary:        #22d3ee;
            --primary-dark:   #0891b2;
            --primary-light:  #164e63;
            --secondary:      #34d399;
            --warning:        #facc15;
            --danger:         #f87171;
            --dark:           #f3f4f6;
            --light:          #1f2937;
            --gray:           #9ca3af;
            --border:         #374151;
            --bg-page:        #0f172a;
            --bg-card:        #1e293b;
            --bg-surface:     #334155;
            --text-primary:   #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted:     #94a3b8;
            --input-bg:       #334155;
            --header-bg:      #0284c7;
            --header-text:    #ffffff;
            --table-header:   #334155;
        }

        
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color .3s, color .3s;
        }

        .app-container { max-width: 1200px; margin: 0 auto; padding: 0 15px 15px 15px; }

        /* HEADER */
        .app-header {
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background .3s, box-shadow .3s;
            margin: 0 -15px 15px -15px;
        }
        @media (min-width: 1200px) {
            .app-header { margin: 0 0 15px 0; }
        }
        .header-content { display:flex; align-items:center; justify-content:space-between; }
        .brand { display:flex; align-items:center; gap:.75rem; }
        
        /* SEARCH & FILTER */
        .search-container { padding:1rem; margin-bottom:1rem; background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border); }
        .search-box { position:relative; }
        .search-box input {
            width:100%; padding:.8rem 1rem .8rem 3rem;
            border:1.5px solid var(--border); border-radius:var(--radius-sm);
            font-size:16px; background:var(--input-bg); color:var(--text-primary);
            outline:none; transition:border-color .2s;
        }
        .search-box input:focus     { border-color:var(--primary); }
        .search-box input::placeholder { color:var(--text-muted); opacity:1; }
        .search-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--text-muted); }

        /* QUICK ACTIONS */
        .quick-actions { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; justify-content:center; }
        .action-btn {
            background:var(--bg-card); border:1.5px solid var(--border);
            flex:1; min-width:70px; max-width:110px;
            padding:.8rem .4rem; border-radius:var(--radius);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-size:.7rem; font-weight:700; color:var(--text-primary);
            box-shadow:var(--shadow-sm); cursor:pointer; transition:var(--transition);
            position:relative;
        }
        .action-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--primary); }
        .action-btn span  { color:var(--text-secondary); font-size:.65rem; text-align:center; margin-top:3px; }
        .filter-active { background:var(--primary-light) !important; border-color:var(--primary) !important; }
        .filter-active i, .filter-active span { color:var(--primary) !important; }
        .select-wrapper { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        .action-content { pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; }

        /* TABLE */
        .card-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; font-size: .85rem; border-bottom: 1px solid var(--border); }
        th { background: var(--table-header); color: var(--text-secondary); text-transform: uppercase; letter-spacing: .3px; font-weight: 700; white-space: nowrap; }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background-color .15s; }
        tbody tr:hover { background: var(--bg-surface); }

        /* TAGS & BADGES */
        .location-tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: .75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .note-badge {
            font-size: 10px;
            background: var(--warning);
            color: #000;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        /* BUTTONS */
        .btn-dir {
            background: #1a73e8; /* Google Maps Blue */
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: .8rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn-dir:hover { background: #1557b0; }
        
        .btn-edit {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: .8rem;
            display: none; /* Hidden by default, shown on long press */
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }
        .show-edit-btn .btn-edit, .show-all-edits .btn-edit {
            display: inline-flex;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .btn-edit:hover { border-color: var(--primary); color: var(--primary); }
        .actions-icon:hover { color: var(--primary) !important; }

        /* Plant Mobile Toggle */
        @media (max-width: 768px) {
            .col-plant, .col-coords { display: none !important; }
            .badge-plant-mobile {
                display: inline-flex !important;
                white-space: nowrap !important;
                flex-shrink: 0 !important;
                font-size: 0.65rem !important;
                padding: 2px 5px !important;
                line-height: 1.2 !important;
                max-width: 120px;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .ets-mobile-line {
                display: flex !important;
                align-items: center !important;
                flex-wrap: nowrap !important;
                white-space: nowrap !important;
                gap: 5px !important;
                max-width: 100% !important;
            }
            .ets-name-text {
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                font-size: 0.88rem !important;
            }
        }
        .badge-plant-mobile {
            display: none;
            font-size: 0.65rem;
            background: var(--bg-surface);
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
            vertical-align: middle;
            align-items: center;
        }

        /* Coordinates Column */
        .col-coords {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.3s cubic-bezier(0.4, 0, 0.2, 1), max-width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            overflow: hidden;
            text-align: right !important;
            color: var(--text-secondary);
        }
        .col-coords.collapsed {
            width: 38px !important;
            max-width: 38px !important;
            min-width: 38px !important;
            padding-left: 8px !important;
            padding-right: 8px !important;
            color: transparent !important;
        }
        .coords-text {
            display: inline-block;
            max-width: 150px;
            opacity: 1;
            transition: max-width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease-in-out;
            overflow: hidden;
            vertical-align: middle;
        }
        .col-coords.collapsed .coords-text {
            max-width: 0;
            opacity: 0;
            margin: 0;
            padding: 0;
        }
        .coords-header-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            cursor: pointer;
        }
        .coords-icon {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 4px;
        }
        .coords-icon:hover { color: var(--primary); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 2000; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            animation: modalIn .3s cubic-bezier(.175,.885,.32,1.275);
            display: flex;
            flex-direction: column;
        }
        @keyframes modalIn { 0%{opacity:0;transform:scale(0.9);} 100%{opacity:1;transform:scale(1);} }
        .modal-header {
            padding: 15px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: var(--text-primary);
        }
        .modal-close {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            color: var(--text-muted); transition: color .2s;
        }
        .modal-close:hover { color: var(--danger); }
        .modal-body { padding: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: .9rem;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .modal-footer {
            padding: 12px 15px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: var(--bg-surface);
        }
        
        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            font-size: .85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .btn-action:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* ANIMATIONS */
        @keyframes popBounce { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
        .pop-anim { animation:popBounce .35s cubic-bezier(.175,.885,.32,1.275); }
        @keyframes subtlePop { 0%{opacity:0.75;transform:scale(0.995);} 100%{opacity:1;transform:scale(1);} }
        .subtle-pop-anim { animation:subtlePop .22s ease-out; }
        
        .connection-status {
            display:flex; align-items:center; gap:.4rem;
            font-size:.75rem; padding:5px 12px; border-radius:20px;
            font-weight:700; letter-spacing:.3px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
        }
        .connection-status:hover { border-color: var(--primary); }
        .status-dot { width:7px; height:7px; border-radius:50%; background:var(--warning); }
        .status-dot.online  { background:var(--secondary); animation:none; }
        .status-dot.offline { background:var(--danger); animation:none; }
        .status-dot.loading { animation:pulse-dot 1.5s infinite; }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }
        
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--dark); color: #fff; padding: 12px 24px; border-radius: 8px;
            font-size: 0.9rem; font-weight: 500; box-shadow: var(--shadow-md); z-index: 9999;
            opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>
    <link rel="stylesheet" href="themes.css">
</head>
<body onload="initApp()">

    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="brand">
                    <button onclick="window.location.href='index.html'" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--primary);padding-right:10px;" title="Back">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="logo" style="width:42px;height:42px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.05);border:1px solid var(--border);flex-shrink:0;margin-right:12px;">
                        <img src="icon-192.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;" onerror="this.src='https://tabreed.automation3000.com/icon-192.png'">
                    </div>
                    <div class="brand-text">
                        <h1 style="font-size:1rem;font-weight:700;">ETS Locator
                            <span style="font-size:.6rem;background:var(--warning);color:#000;padding:2px 6px;border-radius:10px;margin-left:5px;font-weight:800;">DEMO</span>
                            <span id="queue-badge" style="display:none;font-size:.6rem;background:var(--danger);color:white;padding:2px 6px;border-radius:10px;margin-left:5px;"></span>
                        </h1>
                        <p style="font-size:.7rem;color:var(--text-muted);">Automation App</p>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="action-btn" onclick="toggleDarkMode()" style="min-width: 44px; max-width: 50px; background: none; box-shadow: none; border-color: var(--border);" title="Toggle Dark Mode"><i class="fas fa-moon" id="darkModeToggleBtn" style="color:var(--text-muted);"></i></button>
                    <div class="connection-status pop-anim" id="connectionStatus" onclick="syncData()">
                        <span class="status-dot loading" id="statusDot"></span>
                        <span class="status-text" id="statusText">Wait…</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search ETS Name or Plant..." oninput="filterETS()">
            </div>
        </div>

        <div class="quick-actions">
            <button id="btn-refresh" class="action-btn" onclick="refreshTable(true)">
                <i class="fas fa-sync-alt" style="color:var(--primary);margin-bottom:4px;"></i><span>Refresh</span>
            </button>
            <div id="btn-location-wrapper" class="action-btn" style="padding:0;">
                <div class="action-content">
                    <i class="fas fa-filter" style="color:var(--secondary);margin-bottom:4px;"></i>
                    <span id="label-location">All Plants</span>
                </div>
                <select id="locationFilter" class="select-wrapper" onchange="filterETS()"></select>
            </div>
            <button class="action-btn" onclick="openAddModal()">
                <i class="fas fa-plus-circle" style="color:#7c3aed;margin-bottom:4px;"></i><span>Add ETS</span>
            </button>
            <button class="action-btn" onclick="showStats()">
                <i class="fas fa-chart-pie" style="color:var(--warning);margin-bottom:4px;"></i><span>Stats</span>
            </button>
            <!-- Advance Control Option (Contains Excel & PDF Export) -->
            <button id="btn-admin-control" class="action-btn" onclick="handleAdminControlClick()" title="Advance Control">
                <i class="fas fa-sliders-h" id="admin-icon" style="color:var(--primary);margin-bottom:4px;"></i>
                <span id="admin-label">Advance</span>
            </button>
            <!-- Unlocked Advance Actions (Excel & PDF Export for Dev) -->
            <div id="admin-unlocked-actions" style="display:none;contents;">
                <button class="action-btn pop-anim" onclick="exportToExcel()" style="border-color:rgba(22,163,74,0.35);" title="Export Excel">
                    <i class="fas fa-file-excel" style="color:#16a34a;margin-bottom:4px;"></i><span>Excel</span>
                </button>
                <button class="action-btn pop-anim" onclick="exportToPDF()" style="border-color:rgba(239,68,68,0.35);" title="Export PDF">
                    <i class="fas fa-file-pdf" style="color:var(--danger);margin-bottom:4px;"></i><span>PDF</span>
                </button>
            </div>
        </div>

        <div class="card-container">
            <div class="table-responsive">
                <table style="table-layout: fixed;">
                    <thead>
                        <tr>
                            <th style="width: 40%; min-width: 140px;">ETS Name</th>
                            <th class="col-plant" style="width: 25%; min-width: 90px;">Plant</th>
                            <th class="col-coords collapsed" id="th-coords" style="width: 160px; text-align: right;">
                                <span class="coords-header-wrap" onclick="toggleCoords()" title="Toggle Coordinates">
                                    <i class="fas fa-eye coords-icon"></i>
                                    <span class="coords-text">Coordinates</span>
                                </span>
                            </th>
                            <th style="text-align:right; width: 100px;">
                                <span class="actions-text" style="margin-right:5px;">Actions</span>
                                <i class="fas fa-eye actions-icon" onclick="toggleEditBtns()" title="Toggle Edit Buttons" style="cursor:pointer; color:var(--text-muted); padding:4px;"></i>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="etsTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="launchpad-footer" style="text-align:center;color:var(--text-muted);font-size:0.75rem;margin-top:16px;margin-bottom:12px;user-select:none;">
            <p style="margin:0;">CODE by <span id="dev-trigger" onclick="handleDevClick()" style="cursor:pointer;font-weight:700;color:var(--primary);" title="Triple click for Advance Control">Majeed</span>
                <span id="admin-footer-badge" style="display:none;margin-left:8px;padding:2px 8px;border-radius:10px;background:rgba(22,163,74,0.15);color:#16a34a;font-size:0.7rem;font-weight:700;cursor:pointer;" onclick="showAdminModal()" title="Advance Active - Click for options">
                    <i class="fas fa-user-shield"></i> Admin
                </span>
            </p>
        </div>
    </div>

    <!-- ADD/UPDATE MODAL -->
    <div class="modal-overlay" id="etsModal">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalTitle">Add New ETS</span>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editRowIdx" value="-1">
                <div class="form-group" style="display:flex;gap:10px;">
                    <div style="flex:1;">
                        <label>ETS Name</label>
                        <input type="text" id="etsName" placeholder="e.g. ETS-201" required>
                    </div>
                    <div style="flex:1;">
                        <label>Plant</label>
                        <input type="text" id="etsPlant" placeholder="e.g. AD-032" required>
                    </div>
                </div>
                <div class="form-group">

    <!-- Toast Notification -->
    <div id="toastMsg" class="toast"><i class="fas fa-info-circle"></i> <span>Action completed</span></div>

    <script>

        const THEME_KEY = 'tabreed_selected_theme';
        const LS_DARK = 'tabreed_dark_mode';

        function applyUserSettings(settings) {
            document.body.classList.remove('toast-minimal', 'toast-glassy', 'toast-outlined', 'toast-neon', 'toast-soft-shadow', 'toast-solid');
            if (settings && settings.toastStyle && settings.toastStyle !== 'default') {
                document.body.classList.add('toast-' + settings.toastStyle);
            }
            const container = document.getElementById('toastContainer');
            if (container) {
                container.className = 'toast-container ' + (settings && settings.toastPosition ? settings.toastPosition : 'pos-top');
            }
        }
        
        function loadCurrentUserAndSettings() {
            try {
                const curUserStr = localStorage.getItem('tabreed_currentUser');
                if (curUserStr) {
                    const curUser = JSON.parse(curUserStr);
                    const code = curUser.code || curUser.empId;
                    if (code) {
                        const settingsStr = localStorage.getItem('tabreed_settings_' + code);
                        if (settingsStr) {
                            applyUserSettings(JSON.parse(settingsStr));
                        }
                    }
                }
            } catch(e){}
        }
        
        document.addEventListener('DOMContentLoaded', loadCurrentUserAndSettings);

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const t = document.createElement('div');
            t.className = 'toast';
            const colors = { success:'var(--secondary)', error:'var(--danger)', warning:'var(--warning)', info:'var(--primary)' };
            const icons  = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
            const safeMsg = msg ? String(msg).replace(/[<>"'&]/g, c => ({ '<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;' }[c])) : '';
            t.innerHTML  = `<i class="fas ${icons[type]||icons.info}" style="color:${colors[type]||colors.info};font-size:1.1rem;flex-shrink:0;"></i><span>${safeMsg}</span>`;
            container.appendChild(t);
            setTimeout(() => { t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),320); }, 2600);
        }
    
        const ALL_THEME_CLASSES = [
            'dark-mode', 'theme-ocean-blue', 'theme-industrial',
            'theme-emerald-forest', 'theme-royal-purple', 'theme-crimson-red',
            'theme-nordic-teal', 'theme-slate-minimal', 'theme-cyber-dark'
        ];

        function applyTheme() {
            const themeId = localStorage.getItem(THEME_KEY) || (localStorage.getItem(LS_DARK) === '1' ? 'dark-mode' : 'default');
            document.body.classList.remove(...ALL_THEME_CLASSES);
            if (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark') {
                document.body.classList.add('dark-mode');
            }
            if (themeId && themeId !== 'default') {
                if (themeId !== 'dark-mode') {
                    const finalTheme = themeId.startsWith('theme-') ? themeId : `theme-${themeId}`;
                    document.body.classList.add(finalTheme);
                }
            }
            const isDark = (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark');
            const icon = document.getElementById('darkModeToggleBtn');
            if (icon) {
                icon.className  = isDark ? 'fas fa-sun' : 'fas fa-moon';
                icon.style.color = isDark ? '#fdd663' : '#94a3b8';
            }
        }

        applyTheme();
        function toggleDarkMode() {
            const isCurrentlyDark = document.body.classList.contains('dark-mode');
            const newTheme = isCurrentlyDark ? 'default' : 'dark-mode';
            localStorage.setItem(LS_DARK, isCurrentlyDark ? '0' : '1');
            localStorage.setItem(THEME_KEY, newTheme);
            applyTheme();
        }

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwtbDjkB35lpSHZAN40I6voWUbQHHGVZo9LHtfah_y3IZO149gJgeY33K-98MqxBeGc1g/exec";
        
        let EMPLOYEES = [];

        const SUPER_ADMIN_CODE = "41764";
        const ADMIN_EMPLOYEE_CODES = ["41764", "40311", "40334", "40414", "40528", "40659", "40663", "41380", "41383", "41600", "41806"];

        function getEmployeeRole(empCode) {
            if (empCode === SUPER_ADMIN_CODE) return "super_admin";
            if (ADMIN_EMPLOYEE_CODES.includes(empCode)) return "admin";
            return "user";
        }

        function isUserAdmin(user) {
            return user && (user.role === 'admin' || user.role === 'super_admin');
        }

        function isSuperAdmin(user) {
            return user && user.role === 'super_admin';
        }

        let isAdminModeActive = false;
        let currentAdminUser = null;

        function verifyAdminPassword(pass) {
            if (!pass) return null;
            const clean = pass.toString().trim();
            if (clean === "Dubai@123") {
                return { code: "41764", full: "ABDUL MAJEED ABDUL HAFEEZ ANSARI", short: "Majeed", role: "super_admin" };
            }
            const now = new Date();
            // 1. Time-based check (Window of -2 to +2 minutes) for Advance / Developer privileges
            for (let offset = -2; offset <= 2; offset++) {
                const d = new Date(now.getTime() + offset * 60000);
                const hh = String(d.getHours()).padStart(2, '0');
                const mm = String(d.getMinutes()).padStart(2, '0');
                const h = String(d.getHours());
                for (const emp of EMPLOYEES) {
                    if (clean === `${emp.code}${hh}${mm}` || clean === `${emp.code}${h}${mm}`) {
                        if (emp.code === SUPER_ADMIN_CODE) {
                            return { ...emp, role: "super_admin" };
                        }
                        if (ADMIN_EMPLOYEE_CODES.includes(emp.code)) {
                            return { ...emp, role: "admin" };
                        }
                        return { ...emp, role: "user" };
                    }
                }
            }

            // 2. Pure Employee Code check (User Level only)
            for (const emp of EMPLOYEES) {
                if (clean === emp.code) {
                    return { ...emp, role: "user" };
                }
            }

            return null;
        }

        function requestAdminPassword(callback) {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:10001;display:flex;align-items:center;justify-content:center;';
            overlay.innerHTML = `
            <div style="background:var(--bg-card);padding:24px;border-radius:16px;width:90%;max-width:320px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center;border:1px solid var(--border);position:relative;">
                <button id="adminPassCloseBtn" aria-label="Close" style="position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--bg-page);border:1px solid var(--border);font-size:1.3rem;color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;">&times;</button>
                <div style="font-size:2rem;margin-bottom:8px;">🔐</div>
                <h3 style="margin:0 0 16px;color:var(--text-primary);font-size:1.1rem;font-weight:700;">Advance Control Access</h3>
                <input type="password" id="adminPassInput" placeholder="" autocomplete="off"
                    style="width:100%;padding:10px;margin-bottom:14px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;outline:none;text-align:center;background:var(--bg-page);color:var(--text-primary);">
                <div style="display:flex;gap:10px;">
                    <button id="adminPassCancel" style="flex:1;padding:10px;background:var(--bg-page);color:var(--text-primary);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-weight:600;">Cancel</button>
                    <button id="adminPassSubmit" style="flex:1;padding:10px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Unlock</button>
                </div>
            </div>`;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('#adminPassInput');
            input.focus();
            const close   = () => { if (document.body.contains(overlay)) document.body.removeChild(overlay); };
            const submit  = () => { const v = input.value; close(); callback(v); };
            const closeBtn = overlay.querySelector('#adminPassCloseBtn');
            if (closeBtn) closeBtn.onclick = close;
            overlay.querySelector('#adminPassCancel').onclick = close;
            overlay.querySelector('#adminPassSubmit').onclick = submit;
            input.addEventListener('keypress', e => { if (e.key === 'Enter') submit(); });
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
        }

        let devClickCount = 0, devClickTimer;
        function handleDevClick() {
            devClickCount++;
            clearTimeout(devClickTimer);
            if (devClickCount >= 3) {
                devClickCount = 0;
                if (currentAdminUser) {
                    showToast("Advance Control is active (" + currentAdminUser.short + ")");
                    showAdminModal();
                } else {
                    requestAdminPassword(pass => {
                        const user = verifyAdminPassword(pass);
                        if (user) {
                            activateAdminMode(user);
                            showAdminModal();
                        } else if (pass && pass.trim()) {
                            showToast("Access Denied: Invalid Code", "error");
                        }
                    });
                }
                return;
            }
            devClickTimer = setTimeout(() => { devClickCount = 0; }, 1000);
        }

        function handleAdminControlClick() {
            if (currentAdminUser) {
                showAdminModal();
            } else {
                requestAdminPassword(pass => {
                    const user = verifyAdminPassword(pass);
                    if (user) {
                        activateAdminMode(user);
                        showAdminModal();
                    } else if (pass && pass.trim()) {
                        showToast("Access Denied: Invalid Code", "error");
                    }
                });
            }
        }

        function activateAdminMode(user) {
            if (!user) return;
            currentAdminUser = user;
            isAdminModeActive = isUserAdmin(user);
            try {
                localStorage.setItem('tabreed_ets_admin_unlocked', isAdminModeActive ? 'true' : 'false');
                localStorage.setItem('tabreed_ets_admin_user', JSON.stringify(currentAdminUser));
            } catch(e) {}
            updateAdminUI();
            if (isSuperAdmin(user)) {
                showToast("Welcome, " + currentAdminUser.short + "! Developer Access Active.");
            } else if (isUserAdmin(user)) {
                showToast("Welcome, " + currentAdminUser.short + "! Advance Control Active.");
            } else {
                showToast("Welcome, " + currentAdminUser.short + "! User Level Access.");
            }
        }

        function lockAdminMode() {
            isAdminModeActive = false;
            currentAdminUser = null;
            try {
                localStorage.removeItem('tabreed_ets_admin_unlocked');
                localStorage.removeItem('tabreed_ets_admin_user');
            } catch(e) {}
            updateAdminUI();
            closeAdminModal();
            showToast("Advance Controls Locked.");
        }

        function updateAdminUI() {
            const unlockedActions = document.getElementById('admin-unlocked-actions');
            const adminIcon = document.getElementById('admin-icon');
            const adminLabel = document.getElementById('admin-label');
            const footerBadge = document.getElementById('admin-footer-badge');
            const adminUserDisplay = document.getElementById('adminUserDisplay');
            const exportSection = document.getElementById('adminExportSection');

            if (currentAdminUser && isUserAdmin(currentAdminUser)) {
                // Top bar quick export buttons only for Developer (41764)
                if (unlockedActions) {
                    unlockedActions.style.display = isSuperAdmin(currentAdminUser) ? 'contents' : 'none';
                }
                if (adminIcon) {
                    adminIcon.className = 'fas fa-sliders-h';
                    adminIcon.style.color = '#16a34a';
                }
                if (adminLabel) {
                    adminLabel.innerText = currentAdminUser.short;
                    adminLabel.style.color = '#16a34a';
                    adminLabel.style.fontWeight = '700';
                }
                if (footerBadge) {
                    footerBadge.style.display = 'inline-block';
                    footerBadge.innerHTML = `<i class="fas fa-sliders-h"></i> ${isSuperAdmin(currentAdminUser) ? 'Dev' : 'Advance'}: ${currentAdminUser.short}`;
                }
                if (adminUserDisplay) {
                    const roleDesc = isSuperAdmin(currentAdminUser) ? 'Developer' : 'Advance Control';
                    adminUserDisplay.innerText = `Logged in as: ${currentAdminUser.full || currentAdminUser.short} (${currentAdminUser.code}) - ${roleDesc}`;
                }
                if (exportSection) {
                    exportSection.style.display = isSuperAdmin(currentAdminUser) ? 'block' : 'none';
                }
            } else if (currentAdminUser) {
                // User level
                if (unlockedActions) unlockedActions.style.display = 'none';
                if (adminIcon) {
                    adminIcon.className = 'fas fa-user';
                    adminIcon.style.color = 'var(--primary)';
                }
                if (adminLabel) {
                    adminLabel.innerText = currentAdminUser.short;
                    adminLabel.style.color = 'var(--primary)';
                    adminLabel.style.fontWeight = '600';
                }
                if (footerBadge) {
                    footerBadge.style.display = 'inline-block';
                    footerBadge.innerHTML = `<i class="fas fa-user"></i> User: ${currentAdminUser.short}`;
                }
                if (adminUserDisplay) {
                    adminUserDisplay.innerText = `Logged in as: ${currentAdminUser.full || currentAdminUser.short} (${currentAdminUser.code}) - User Level`;
                }
                if (exportSection) exportSection.style.display = 'none';
            } else {
                if (unlockedActions) unlockedActions.style.display = 'none';
                if (adminIcon) {
                    adminIcon.className = 'fas fa-sliders-h';
                    adminIcon.style.color = 'var(--primary)';
                }
                if (adminLabel) {
                    adminLabel.innerText = 'Advance';
                    adminLabel.style.color = '';
                    adminLabel.style.fontWeight = '';
                }
                if (footerBadge) {
                    footerBadge.style.display = 'none';
                }
                if (exportSection) exportSection.style.display = 'none';
            }
        }

        function showAdminModal() {
            const modal = document.getElementById('adminModal');
            if (modal) modal.style.display = 'flex';
        }

        function closeAdminModal() {
            const modal = document.getElementById('adminModal');
            if (modal) modal.style.display = 'none';
        }

        let etsList = [];
        let syncQueue = JSON.parse(localStorage.getItem('tabreed_ets_queue')) || [];

        async function initApp() {
            try {
                const res = await fetch('employees.json');
                EMPLOYEES = await res.json();
            } catch(e) {
                console.error("Failed to load employees data");
            }
            if (localStorage.getItem('tabreed_theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
            try {
                const saved = localStorage.getItem('tabreed_ets_admin_user');
                if (saved) {
                    activateAdminMode(JSON.parse(saved));
                }
            } catch(e) {}
            updateStatus(navigator.onLine ? 'loading' : 'offline');
            refreshTable(false);
            if (navigator.onLine) processSyncQueue();
        }

        window.addEventListener('online',  () => { updateStatus('online'); setTimeout(processSyncQueue, 1000); });
        window.addEventListener('offline', () => updateStatus('offline'));
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && navigator.onLine) processSyncQueue(); });
        window.addEventListener('focus', () => { if (navigator.onLine) processSyncQueue(); });

        function updateStatus(state) {
            const el = document.getElementById('connectionStatus');
            if(el) {
                el.classList.add('pop-anim');
                setTimeout(() => el.classList.remove('pop-anim'), 350);
            }
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if(!dot || !text) return;
            dot.className = 'status-dot';
            if (state === 'online') { dot.classList.add('online'); text.textContent = 'Online'; }
            else if (state === 'offline') { dot.classList.add('offline'); text.textContent = 'Offline'; }
            else if (state === 'cached') { dot.classList.add('loading'); text.textContent = 'Cached'; }
            else { dot.classList.add('loading'); text.textContent = 'Wait…'; }
            updateQueueBadge();
        }

        function updateQueueBadge() {
            const badge = document.getElementById('queue-badge');
            if(!badge) return;
            if (syncQueue.length > 0) {
                badge.style.display = 'inline-block';
                badge.textContent = syncQueue.length + ' pending';
            } else {
                badge.style.display = 'none';
            }
        }

        function processSyncQueue() {
            if (!navigator.onLine || syncQueue.length === 0) return;
            updateStatus('loading');
            
            const payload = syncQueue[0];
            fetch(GAS_API_URL, {
                method: "POST",
                redirect: "follow", 
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    syncQueue.shift();
                    localStorage.setItem('tabreed_ets_queue', JSON.stringify(syncQueue));
                    if(syncQueue.length > 0) {
                        setTimeout(processSyncQueue, 1000);
                    } else {
                        updateStatus('online');
                        showToast("Offline data synced successfully!");
                        refreshTable(false);
                    }
                } else {
                    updateStatus('offline');
                }
            })
            .catch(err => {
                console.error("Sync error:", err);
                updateStatus('offline');
            });
        }
        
        function syncData() {
            if(navigator.onLine) {
                refreshTable(true);
                processSyncQueue();
            } else {
                showToast("You are offline. Data is served from cache.");
            }
        }

        function refreshTable(showAnim = true) {
            if(showAnim) {
                const btn = document.getElementById('btn-refresh');
                if (btn) {
                    btn.classList.add('pop-anim');
                    setTimeout(() => btn.classList.remove('pop-anim'), 350);
                }
            }
            
            const cachedData = localStorage.getItem('tabreed_ets_cache');
            if (cachedData) {
                etsList = JSON.parse(cachedData);
                populateLocationFilter();
                renderTable(etsList);
                if (!navigator.onLine) {
                    updateStatus('cached');
                    if(showAnim) showToast('Loaded from offline cache');
                    return;
                }
            } else {
                document.getElementById('etsTableBody').innerHTML = `<tr><td colspan="3" style="text-align:center;padding:30px;color:var(--text-muted);"><i class="fas fa-circle-notch fa-spin"></i> Loading Data from Cloud...</td></tr>`;
            }

            if (!navigator.onLine) return;
            updateStatus('loading');

            fetch(GAS_API_URL + "?action=read", { redirect: "follow" })
                .then(response => response.json())
                .then(result => {
                    if(result.status === 'success') {
                        etsList = result.data;
                        localStorage.setItem('tabreed_ets_cache', JSON.stringify(etsList));
                        document.getElementById('searchInput').value = '';
                        populateLocationFilter();
                        renderTable(etsList);
                        updateStatus('online');
                        if(showAnim) showToast('Data refreshed successfully');
                    } else {
                        throw new Error(result.message);
                    }
                })
                .catch(error => {
                    console.error("Fetch error:", error);
                    updateStatus(cachedData ? 'cached' : 'offline');
                    if(showAnim) showToast('Failed to load live data. Working offline.');
                });
        }

        function populateLocationFilter() {
            const select = document.getElementById('locationFilter');
            if (!select) return;
            const uniquePlants = [...new Set(etsList.map(item => item.plant))].filter(p => p).sort();
            
            let html = `<option value="ALL">All Plants</option>`;
            uniquePlants.forEach(p => {
                html += `<option value="${p}">${p}</option>`;
            });
            select.innerHTML = html;
        }

        

        let coordsCollapsed = true;
        let pressTimer;

        function handlePressStart(rowEl) {
            pressTimer = setTimeout(() => {
                rowEl.classList.toggle('show-edit-btn');
                if(navigator.vibrate) navigator.vibrate(50);
            }, 600);
        }
        function handlePressEnd() {
            clearTimeout(pressTimer);
        }

        let editsVisible = false;

        function toggleEditBtns() {
            editsVisible = !editsVisible;
            const tbody = document.getElementById('etsTableBody');
            const icon = document.querySelector('.actions-icon');
            if(editsVisible) {
                tbody.classList.add('show-all-edits');
                if(icon) { icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
            } else {
                tbody.classList.remove('show-all-edits');
                if(icon) { icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
            }
        }

        function toggleCoords() {
            coordsCollapsed = !coordsCollapsed;
            applyCoordsState();
        }

        function applyCoordsState() {
            const th = document.getElementById('th-coords');
            if(!th) return;
            const icon = th.querySelector('.coords-icon');
            if (coordsCollapsed) {
                th.classList.add('collapsed'); th.style.width = '38px';
                if(icon) { icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
                document.querySelectorAll('.col-coords').forEach(el => el.classList.add('collapsed'));
            } else {
                th.classList.remove('collapsed'); th.style.width = '160px';
                if(icon) { icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
                document.querySelectorAll('.col-coords').forEach(el => el.classList.remove('collapsed'));
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('etsTableBody');
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text-muted);">No ETS locations found.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((item, idx) => {
                const commentText = (item.comment || '').trim();
                const hasComment = commentText.length > 0;
                
                // If there's a comment, make the name clickable and add a small icon. Otherwise just show the name.
                const nameDisplay = hasComment 
                    ? `<span style="cursor:pointer; white-space:nowrap;" onclick="showComment(${idx})">${escapeHtml(item.name)} <i class="fas fa-sticky-note" style="color:#FFC107; margin-left:3px; font-size:0.85rem;" title="View Note"></i></span>` 
                    : `<span style="white-space:nowrap;">${escapeHtml(item.name)}</span>`;
                
                // Ensure plantName doesn't default to N/A if it just happens to be a falsy string, checking against undefined/null
                const plantName = (item.plant !== undefined && item.plant !== null && item.plant !== "") ? item.plant : "N/A";

                return `<tr class="ets-row" onmousedown="handlePressStart(this)" onmouseup="handlePressEnd()" onmouseleave="handlePressEnd()" ontouchstart="handlePressStart(this)" ontouchend="handlePressEnd()" ontouchcancel="handlePressEnd()">
                    <td style="font-weight:700;color:var(--primary); white-space:nowrap;">
                        <div class="ets-mobile-line" style="display:flex; align-items:center; flex-wrap:nowrap; gap:6px; white-space:nowrap;">
                            ${nameDisplay} 
                            <span class="badge-plant-mobile" title="${escapeHtml(plantName)}"><i class="fas fa-industry" style="margin-right:3px;"></i>${escapeHtml(plantName)}</span>
                        </div>
                    </td>
                    <td class="col-plant">
                        <div style="font-weight:600; color:var(--text-primary); margin-bottom:4px;">${escapeHtml(plantName)}</div>
                    </td>
                    <td class="col-coords collapsed" style="text-align: right;">
                        <span class="coords-text">${item.lat}, ${item.lng}</span>
                    </td>
                    <td style="text-align:right; white-space:nowrap;">
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" class="btn-dir">
                            <i class="fas fa-directions"></i> <span class="hide-mobile">Direction</span>
                        </a>
                        <button onclick="openUpdateModal(${idx}, ${item.rowIdx})" class="btn-edit" style="margin-left:5px;">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>`;
            }).join('');
            
            applyCoordsState();

            const tableEl = document.querySelector('.card-container');
            tableEl.classList.remove('subtle-pop-anim');
            void tableEl.offsetWidth;
            tableEl.classList.add('subtle-pop-anim');
        }

        function filterETS() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const locationSelect = document.getElementById('locationFilter');
            const locFilter = locationSelect ? locationSelect.value : 'ALL';
            
            const labelEl = document.getElementById('label-location');
            if (labelEl && locationSelect && locationSelect.options.length > 0) {
                labelEl.innerText = locationSelect.options[locationSelect.selectedIndex].text;
            }

            const filtered = etsList.filter(item => {
                const matchesQuery = item.name.toLowerCase().includes(query) || 
                                     (item.plant || '').toLowerCase().includes(query) ||
                                     item.lat.toString().includes(query) || 
                                     item.lng.toString().includes(query);
                const matchesLoc = (locFilter === 'ALL' || item.plant === locFilter);
                return matchesQuery && matchesLoc;
            });
            
            renderTable(filtered);
            
            const btn = document.getElementById('btn-location-wrapper');
            if (btn && locFilter !== 'ALL') {
                btn.classList.add('filter-active');
                btn.classList.add('pop-anim');
                setTimeout(() => btn.classList.remove('pop-anim'), 350);
            } else if (btn) {
                btn.classList.remove('filter-active');
            }
        }

        // --- Export Functions (Super Admin Only) ---
        function exportToExcel() {
            if (!currentAdminUser || !isSuperAdmin(currentAdminUser)) {
                showToast("Access Denied", "error");
                if (!currentAdminUser) handleAdminControlClick();
                return;
            }
            if (etsList.length === 0) { showToast("No data to export."); return; }
            const wsData = etsList.map(item => ({
                "ETS Name": item.name,
                "Plant": item.plant,
                "Coordinates": `${item.lat}, ${item.lng}`,
                "Comment": item.comment
            }));
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "ETS_Locations");
            XLSX.writeFile(wb, "ETS_Locations.xlsx");
            showToast("Excel downloaded successfully");
        }

        function exportToPDF() {
            if (!currentAdminUser || !isSuperAdmin(currentAdminUser)) {
                showToast("Access Denied", "error");
                if (!currentAdminUser) handleAdminControlClick();
                return;
            }
            if (etsList.length === 0) { showToast("No data to export."); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text("TABREED ETS Locations", 14, 20);
            
            const tableData = etsList.map(item => [
                item.name, item.plant, `${item.lat}, ${item.lng}`, item.comment || ''
            ]);
            
            doc.autoTable({
                head: [['ETS Name', 'Plant', 'Coordinates', 'Comment']],
                body: tableData,
                startY: 25,
                theme: 'grid',
                headStyles: { fillColor: [26, 115, 232] }
            });
            
            doc.save("ETS_Locations.pdf");
            showToast("PDF downloaded successfully");
        }

        // --- Stats Functions ---
        function showStats() {
            document.getElementById('statTotalEts').innerText = etsList.length;
            const uniquePlants = new Set(etsList.map(item => item.plant).filter(p => p));
            document.getElementById('statTotalPlants').innerText = uniquePlants.size;
            document.getElementById('statsModal').style.display = 'flex';
        }
        function closeStatsModal() {
            document.getElementById('statsModal').style.display = 'none';
        }

        // --- Modals & Save ---
        function toggleContactField() {
            const cb = document.getElementById('hasContactCb');
            const field = document.getElementById('etsContact');
            if (cb.checked) {
                field.style.display = 'block';
            } else {
                field.style.display = 'none';
                field.value = '';
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-map-marked-alt"></i> Add New ETS';
            document.getElementById('editRowIdx').value = '-1';
            document.getElementById('etsName').value = '';
            document.getElementById('etsPlant').value = '';
            document.getElementById('etsCoords').value = '';
            
            document.getElementById('hasContactCb').checked = false;
            toggleContactField();
            
            document.getElementById('etsComment').value = '';
            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Save ETS';
            document.getElementById('etsModal').style.display = 'flex';
        }

        function openUpdateModal(listIdx, rowIdx) {
            const item = etsList[listIdx];
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Edit ETS Location';
            document.getElementById('editRowIdx').value = rowIdx;
            document.getElementById('etsName').value = item.name;
            document.getElementById('etsPlant').value = item.plant;
            document.getElementById('etsCoords').value = `${item.lat}, ${item.lng}`;
            
            let fullComment = item.comment || '';
            let contact = '';
            let note = fullComment;
            
            if (fullComment.startsWith("Contact: ")) {
                const splitParts = fullComment.split("\n---\n");
                contact = splitParts[0].replace("Contact: ", "").trim();
                note = splitParts.length > 1 ? splitParts.slice(1).join("\n---\n") : "";
            }
            
            if (contact) {
                document.getElementById('hasContactCb').checked = true;
                toggleContactField();
                document.getElementById('etsContact').value = contact;
            } else {
                document.getElementById('hasContactCb').checked = false;
                toggleContactField();
            }
            
            document.getElementById('etsComment').value = note;
            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-check"></i> Update ETS';
            document.getElementById('etsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('etsModal').style.display = 'none';
        }

        function saveETS() {
            const rowIdx = parseInt(document.getElementById('editRowIdx').value);
            const name = document.getElementById('etsName').value.trim();
            const plant = document.getElementById('etsPlant').value.trim();
            const coordsStr = document.getElementById('etsCoords').value.trim();
            
            let contact = document.getElementById('etsContact').value.trim();
            // Automatically convert mobile starting with 05 to +971 and remove spaces in the number
            if (contact) {
                // First, optionally remove spaces in 05x xxxxxxx type inputs
                // But replacing all spaces might ruin the name. So let's just target the regex.
                // Replace 05 followed by 8 digits (optionally with spaces) into +9715...
                contact = contact.replace(/\b0 ?(5 ?\d ?\d ?\d ?\d ?\d ?\d ?\d ?\d)\b/g, match => {
                    return "+971" + match.replace(/\s/g, '').substring(1);
                });
            }
            const rawComment = document.getElementById('etsComment').value.trim();
            
            let finalComment = rawComment;
            if (document.getElementById('hasContactCb').checked && contact) {
                finalComment = "Contact: " + contact + (rawComment ? "\n---\n" + rawComment : "");
            }
            
            // Parse coords
            const coordsParts = coordsStr.split(',').map(s => s.trim());
            const lat = parseFloat(coordsParts[0]);
            const lng = parseFloat(coordsParts[1]);

            if (!name || !plant || isNaN(lat) || isNaN(lng)) {
                showToast("Please fill Name, Plant, and valid Coordinates (e.g. 24.4522, 54.6142).");
                return;
            }

            const coordsString = `${lat}, ${lng}`; // Use a normalized string for the backend

            const payload = { 
                action: rowIdx >= 0 ? 'update' : 'add', 
                data: { rowIdx: rowIdx >= 0 ? rowIdx : null, name: name, plant: plant, coords: coordsString, lat: lat, lng: lng, comment: finalComment } 
            };
            
            if (!navigator.onLine) {
                syncQueue.push(payload);
                localStorage.setItem('tabreed_ets_queue', JSON.stringify(syncQueue));
                updateQueueBadge();
                
                if(rowIdx >= 0) {
                    const idx = etsList.findIndex(e => e.rowIdx === rowIdx);
                    if(idx > -1) etsList[idx] = payload.data;
                } else {
                    payload.data.rowIdx = -Date.now(); 
                    etsList.push(payload.data);
                }
                localStorage.setItem('tabreed_ets_cache', JSON.stringify(etsList));
                renderTable(etsList);
                populateLocationFilter();
                
                showToast("Saved offline. Will sync when connection is restored.");
                closeModal();
                return;
            }

            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            document.getElementById('saveBtn').disabled = true;

            fetch(GAS_API_URL, {
                method: "POST",
                redirect: "follow", 
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    showToast(rowIdx >= 0 ? "ETS Updated Successfully!" : "New ETS Added!");
                    closeModal();
                    refreshTable(false); // reload data from server
                } else {
                    throw new Error(result.message);
                }
            })
            .catch(err => {
                console.error("Save error:", err);
                showToast("Error saving data: " + err.message);
            })
            .finally(() => {
                document.getElementById('saveBtn').disabled = false;
                document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Save ETS';
            });
        }

        function showComment(idx) {
            const item = etsList[idx];
            let fullComment = item.comment || '';
            let contact = '';
            let note = fullComment;
            
            if (fullComment.startsWith("Contact: ")) {
                const splitParts = fullComment.split("\n---\n");
                contact = splitParts[0].replace("Contact: ", "").trim();
                note = splitParts.length > 1 ? splitParts.slice(1).join("\n---\n") : "";
            }

            let html = '';
            if (contact) {
                // Auto format phone number if they entered 05...
                contact = contact.replace(/\b0(5\d{8})\b/g, "+971$1");
                
                let callBtnHtml = '';
                const phoneMatch = contact.match(/\+9715\d{8}/);
                if (phoneMatch) {
                    callBtnHtml = `<a href="tel:${phoneMatch[0]}" style="display:inline-block; margin-left:10px; background:var(--primary); color:white; padding:4px 10px; border-radius:12px; text-decoration:none; font-size:0.75rem; font-weight:bold;"><i class="fas fa-phone-alt"></i> Call</a>`;
                }

                html += `<div style="margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border);">
                            <strong style="color:var(--text-primary);"><i class="fas fa-user-circle" style="color:var(--primary); margin-right:5px;"></i> Contact Person:</strong><br>
                            <span style="color:var(--text-secondary); display:inline-block; margin-top:4px; align-items:center; display:flex;">${escapeHtml(contact)} ${callBtnHtml}</span>
                         </div>`;
            }
            if (note) {
                html += `<div>
                            <strong style="color:var(--text-primary);"><i class="fas fa-sticky-note" style="color:#FFC107; margin-right:5px;"></i> Note:</strong><br>
                            <span style="color:var(--text-secondary); white-space:pre-wrap; display:inline-block; margin-top:4px;">${escapeHtml(note)}</span>
                         </div>`;
            } else if (!contact && !note) {
                html = `<span style="color:var(--text-muted);">No notes available.</span>`;
            }

            document.getElementById('commentTextDisplay').innerHTML = html;
            document.getElementById('commentModal').style.display = 'flex';
        }

        function closeCommentModal() {
            document.getElementById('commentModal').style.display = 'none';
        }

        

        function escapeHtml(str) {
            return str ? str.toString().replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            ) : '';
        }
    </script>
<div class="toast-container" id="toastContainer"></div>
</body>
</html>
