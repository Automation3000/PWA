<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Library - Automation App</title>
    <script>
        (function() {
            try {
                var _fetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
                var defineFetchProp = function(target) {
                    if (!target) return;
                    try {
                        Object.defineProperty(target, 'fetch', {
                            get: function() { return _fetch; },
                            set: function(val) { _fetch = val; },
                            configurable: true,
                            enumerable: true
                        });
                    } catch (_) {}
                };
                defineFetchProp(window);
                if (typeof Window !== 'undefined' && Window.prototype) {
                    defineFetchProp(Window.prototype);
                }
            } catch (e) {}
            try {
                window.addEventListener('error', function(event) {
                    if (
                        (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
                        (event.message && (
                            event.message.indexOf('Cannot set property fetch') !== -1 ||
                            event.message.indexOf('fetch of #<Window>') !== -1
                        ))
                    ) {
                        event.preventDefault();
                        if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
                        return true;
                    }
                }, true);
            } catch (e) {}
        })();
    </script>
    <!-- Reusing styles from index.html for consistency -->
    <link rel="icon" href="https://cdn.brandfetch.io/idYzxNpaam/w/400/h/400/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&t=1763636632146" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <style>
        

        /* ═══════════════════════════════════════════════════
           DARK MODE — Carefully designed for readability
        ═══════════════════════════════════════════════════ */
        

        body.theme-ocean-blue {
            --primary:        #0284c7;
            --primary-dark:   #0369a1;
            --primary-light:  #e0f2fe;
            --header-bg:      #0c4a6e;
            --bg-page:        #f0f9ff;
        }

        body.theme-industrial {
            --primary:        #d97706;
            --primary-dark:   #b45309;
            --primary-light:  #fef3c7;
            --header-bg:      #1f2937;
            --bg-page:        #fffbeb;
        }

        body.theme-emerald-forest {
            --primary:        #059669;
            --primary-dark:   #047857;
            --primary-light:  #d1fae5;
            --header-bg:      #064e3b;
            --bg-page:        #f0fdf4;
        }

        body.theme-royal-purple {
            --primary:        #7c3aed;
            --primary-dark:   #6d28d9;
            --primary-light:  #ede9fe;
            --header-bg:      #4c1d95;
            --bg-page:        #faf5ff;
        }

        body.theme-crimson-red {
            --primary:        #dc2626;
            --primary-dark:   #b91c1c;
            --primary-light:  #fee2e2;
            --header-bg:      #7f1d1d;
            --bg-page:        #fef2f2;
        }

        body.theme-nordic-teal {
            --primary:        #0d9488;
            --primary-dark:   #0f766e;
            --primary-light:  #ccfbf1;
            --header-bg:      #134e4a;
            --bg-page:        #f0fdfa;
        }

        body.theme-slate-minimal {
            --primary:        #475569;
            --primary-dark:   #334155;
            --primary-light:  #f1f5f9;
            --header-bg:      #0f172a;
            --bg-page:        #f8fafc;
        }

        body.theme-cyber-dark {
            --primary:        #22d3ee;
            --primary-dark:   #0891b2;
            --primary-light:  #164e63;
            --secondary:      #34d399;
            --warning:        #facc15;
            --danger:         #f87171;
            --dark:           #f3f4f6;
            --light:          #1f2937;
            --gray:           #9ca3af;
            --border:         #374151;
            --bg-page:        #0f172a;
            --bg-card:        #1e293b;
            --bg-surface:     #334155;
            --text-primary:   #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted:     #94a3b8;
            --input-bg:       #334155;
            --header-bg:      #0284c7;
            --header-text:    #ffffff;
            --table-header:   #334155;
        }

        
* { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-page); color: var(--text-primary); line-height: 1.5; }
        .app-container { max-width:1200px; margin:0 auto; padding: 1rem; }
        .app-header { background: var(--bg-card); padding: 1rem 1.5rem; border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
        .header-content { display:flex; align-items:center; justify-content:space-between; }
        .brand { display:flex; align-items:center; gap:.75rem; }
        .logo { width:42px; height:42px; background:white; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:var(--shadow-sm); border:1px solid var(--border); flex-shrink:0; }
        .search-container { padding:1rem; margin:1rem 0; background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border); }
        .search-box { position:relative; }
        .search-box input { width:100%; padding:.8rem 1rem .8rem 3rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:16px; background:var(--bg-surface); color:var(--text-primary); outline:none; transition:border-color .2s; }
        .search-box input:focus { border-color:var(--primary); }
        .search-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--text-muted); }
        .doc-section { background: var(--bg-card); margin: 1.5rem 0; padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        /* --- Section Header Base Style --- */
        .doc-section h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0; /* Reset margin for new accordion header */
        }
        .doc-list { list-style: none; }
        .doc-list li { margin-bottom: .75rem; }
        .doc-list a { color: var(--primary); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: .5rem; transition: color .2s; }
        .doc-list a:hover { color: var(--primary-dark); }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
        .media-item img, .media-item video { width: 100%; height: auto; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .2s; }
        .media-item img:hover, .media-item video:hover { transform: scale(1.05); }
        .media-item p { font-size: .8rem; text-align: center; color: var(--text-secondary); margin-top: .5rem; font-weight: 600; }
        .no-results { text-align: center; padding: 2rem; color: var(--text-muted); }
        
        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            border: none;
            box-shadow: var(--shadow-md);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            transition: transform .2s, background-color .2s;
        }
        .fab:hover { transform: scale(1.08); background-color: var(--primary-dark); }
        
        /* Accordion styles - with click effect */
        .accordion-header {
            cursor: pointer;
            transition: all .3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-sm);
            background-color: var(--bg-surface);
        }
        .accordion-header:hover {
            background-color: var(--primary-light);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .accordion-header.active {
            background-color: var(--primary-light);
            color: var(--primary);
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }
        .accordion-header .accordion-icon { transition: transform .3s ease; }
        .accordion-header.active .accordion-icon { transform: rotate(180deg); }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.98);
            transform-origin: top;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .doc-section.is-open .accordion-content {
            max-height: 110vh; /* Accommodate 100vh iframe + padding */
            opacity: 1;
            transform: scale(1);
            padding-top: 1rem;
        }
        
        /* Iframe styles */
        .drive-iframe { width: 100%; height: 100vh; /* Set to full viewport height to minimize inner scrolling */ border: 1px solid var(--border); border-radius: var(--radius-sm); }

        /* Modal styles for consistency */
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); display:none; z-index:9999; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--bg-card); width:95%; max-width:500px; border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.25); border:1px solid var(--border); }
        .modal-header { padding:1.1rem 1.4rem; background:var(--primary); color:white; display:flex; justify-content:space-between; align-items:center; }
        .modal-header h3 { font-size:1rem; font-weight:700; }
        .modal-body { padding:1.5rem; }
        .form-group { margin-bottom:1.2rem; }
        .form-group label { display:block; margin-bottom:.4rem; font-weight:600; font-size:.85rem; }
        .modal-actions { display:flex; gap:.8rem; margin-top:1.2rem; }
        .btn-primary { flex:1; padding:.9rem; background:var(--primary); color:white; border:none; border-radius:var(--radius-sm); font-weight:700; cursor:pointer; font-size:.9rem; transition:.2s; }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-secondary { flex:1; padding:.9rem; background:var(--bg-surface); color:var(--text-primary); border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; font-weight:600; font-size:.9rem; transition:.2s; }
        .btn-secondary:hover { border-color:var(--primary); }

        /* Dark Mode specific styles */
        body.dark-mode .app-header, body.dark-mode .doc-section { background: var(--bg-card) !important; border-color: var(--border) !important; }
        body.dark-mode .doc-section h2 { color: var(--text-primary) !important; border-color: var(--border) !important; }
        body.dark-mode .accordion-header:hover { background-color: var(--bg-surface) !important; }
        body.dark-mode .doc-list a { color: var(--primary) !important; }
        body.dark-mode .media-item p { color: var(--text-secondary) !important; }
        body.dark-mode .modal { background: var(--bg-card); border-color: var(--border); }
        body.dark-mode .form-group label { color: var(--text-primary); }
        body.dark-mode .btn-secondary { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border); }
        body.dark-mode #fileUploadInput { background: var(--bg-surface); border-color: var(--border); color: var(--text-primary); }
    </style>
    <link rel="stylesheet" href="themes.css">
</head>
<body>

        <header class="app-header">

                <div class="brand">
                    <button onclick="window.location.href='index.html'" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--primary);padding-right:10px;" title="Back"><i class="fas fa-arrow-left"></i></button>
                    <div class="logo">
                        <img src="icon-192.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;" onerror="this.src='https://tabreed.automation3000.com/icon-192.png'">
                    </div>
                    <div class="brand-text">
                        <h1 style="font-size:1rem;font-weight:700;color:var(--text-primary);">Document Library</h1>

    <!-- Floating Action Button for Upload -->
    <button class="fab" onclick="openUploadModal()" title="Upload a File">
        <i class="fas fa-upload"></i>
    </button>

    <!-- UPLOAD MODAL -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-cloud-upload-alt"></i> Upload to Library</h3>
                <button onclick="closeUploadModal()" style="background:none;border:none;cursor:pointer;font-size:1.5rem;color:white;line-height:1;">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="fileUploadInput">Select a PDF, Image, or Video file</label>
                    <input type="file" id="fileUploadInput" accept=".pdf,image/*,video/*" style="width:100%; padding: 1rem; border: 2px dashed var(--border); background: var(--bg-surface); border-radius: var(--radius-sm); text-align: center; cursor: pointer;">
                </div>
                <div id="upload-progress" style="display:none; text-align:center; margin-top:1rem; color: var(--primary); font-weight: 600;">
                    <p><i class="fas fa-spinner fa-spin"></i> Uploading, please wait...</p>
                    <p style="font-size: .8rem; color: var(--text-muted);">(This may take a moment for large files)</p>
                </div>
                <div class="modal-actions">
                    <button class="btn-primary" onclick="handleFileUpload()" id="submitUploadBtn">UPLOAD FILE</button>
                    <button class="btn-secondary" onclick="closeUploadModal()">CANCEL</button>

    <script>

        const THEME_KEY = 'tabreed_selected_theme';
        const LS_DARK = 'tabreed_dark_mode';

        function applyUserSettings(settings) {
            document.body.classList.remove('toast-minimal', 'toast-glassy', 'toast-outlined', 'toast-neon', 'toast-soft-shadow', 'toast-solid');
            if (settings && settings.toastStyle && settings.toastStyle !== 'default') {
                document.body.classList.add('toast-' + settings.toastStyle);
            }
            const container = document.getElementById('toastContainer');
            if (container) {
                container.className = 'toast-container ' + (settings && settings.toastPosition ? settings.toastPosition : 'pos-top');
            }
        }
        
        function loadCurrentUserAndSettings() {
            try {
                const curUserStr = localStorage.getItem('tabreed_currentUser');
                if (curUserStr) {
                    const curUser = JSON.parse(curUserStr);
                    const code = curUser.code || curUser.empId;
                    if (code) {
                        const settingsStr = localStorage.getItem('tabreed_settings_' + code);
                        if (settingsStr) {
                            applyUserSettings(JSON.parse(settingsStr));
                        }
                    }
                }
            } catch(e){}
        }
        
        document.addEventListener('DOMContentLoaded', loadCurrentUserAndSettings);

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const t = document.createElement('div');
            t.className = 'toast';
            const colors = { success:'var(--secondary)', error:'var(--danger)', warning:'var(--warning)', info:'var(--primary)' };
            const icons  = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
            const safeMsg = msg ? String(msg).replace(/[<>"'&]/g, c => ({ '<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;' }[c])) : '';
            t.innerHTML  = `<i class="fas ${icons[type]||icons.info}" style="color:${colors[type]||colors.info};font-size:1.1rem;flex-shrink:0;"></i><span>${safeMsg}</span>`;
            container.appendChild(t);
            setTimeout(() => { t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),320); }, 2600);
        }
    
        const ALL_THEME_CLASSES = [
            'dark-mode', 'theme-ocean-blue', 'theme-industrial',
            'theme-emerald-forest', 'theme-royal-purple', 'theme-crimson-red',
            'theme-nordic-teal', 'theme-slate-minimal', 'theme-cyber-dark'
        ];

        function applyTheme() {
            const themeId = localStorage.getItem(THEME_KEY) || (localStorage.getItem(LS_DARK) === '1' ? 'dark-mode' : 'default');
            document.body.classList.remove(...ALL_THEME_CLASSES);
            if (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark') {
                document.body.classList.add('dark-mode');
            }
            if (themeId && themeId !== 'default') {
                if (themeId !== 'dark-mode') {
                    const finalTheme = themeId.startsWith('theme-') ? themeId : `theme-${themeId}`;
                    document.body.classList.add(finalTheme);
                }
            }
            const isDark = (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark');
            const icon = document.getElementById('darkModeToggleBtn');
            if (icon) {
                icon.className  = isDark ? 'fas fa-sun' : 'fas fa-moon';
                icon.style.color = isDark ? '#fdd663' : '#94a3b8';
            }
        }

        applyTheme();
        function toggleDarkMode() {
            const isCurrentlyDark = document.body.classList.contains('dark-mode');
            const newTheme = isCurrentlyDark ? 'default' : 'dark-mode';
            localStorage.setItem(LS_DARK, isCurrentlyDark ? '0' : '1');
            localStorage.setItem(THEME_KEY, newTheme);
            applyTheme();
        }

        // IMPORTANT: Replace this URL with the one you got after deploying the Google Apps Script.
        // IMPORTANT: Paste the NEW URL you get after re-deploying the script with the correct permissions.
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyuU8Ex0xKje6OmnaGKYFIJIp6U16ZoOhQPiVhL5URULn060tydvJL_koJDa7psrJc-6Q/exec";

        // Simple dark mode toggle to maintain theme consistency
        

        // --- UPLOAD FUNCTIONALITY ---
        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('fileUploadInput').value = ''; // Reset file input
            document.getElementById('upload-progress').style.display = 'none';
            document.getElementById('submitUploadBtn').disabled = false;
        }

        function handleFileUpload() {
            const fileInput = document.getElementById('fileUploadInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a file to upload.');
                return;
            }

            document.getElementById('upload-progress').style.display = 'block';
            document.getElementById('submitUploadBtn').disabled = true;

            const reader = new FileReader();
            reader.onload = (e) => {
                const fileData = e.target.result.split(',')[1]; // Get Base64 part
                const payload = {
                    filename: file.name,
                    mimeType: file.type,
                    data: fileData
                };

                // Send to Google Apps Script
                fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    // The 'redirect' option can help debug, but we'll handle non-JSON responses instead.
                    // redirect: 'follow' 
                })
                .then(response => {
                    const contentType = response.headers.get("content-type");
                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        return response.json(); // Response is JSON, proceed as normal.
                    } else {
                        // Response is HTML, which means a permission or deployment error on Google's side.
                        throw new Error("Server returned an invalid response (not JSON). This is likely a permission issue. Please re-deploy the script and grant all permissions.");
                    }
                })
                .then(result => {
                    if (result.success) {
                        alert('File uploaded successfully! It will appear in the library shortly.');
                        // Refresh the iframes to show the new file
                        document.querySelectorAll('.drive-iframe').forEach(iframe => {
                            iframe.src = iframe.src; // This reloads the iframe
                        });
                    } else {
                        throw new Error(result.error || 'An unknown server error occurred.');
                    }
                    closeUploadModal();
                })
                .catch(error => {
                    console.error('Upload Error:', error);
                    alert('Upload failed: ' + error.message);
                    closeUploadModal();
                });
            };
            reader.readAsDataURL(file);
        }

        // --- INITIALIZE ---
        document.addEventListener('DOMContentLoaded', () => {
            // Restore dark mode on page load
            if (localStorage.getItem('tabreed_dark_mode') === '1') {
                document.body.classList.add('dark-mode');
                const icon = document.getElementById('darkModeToggleBtn');
                icon.className = 'fas fa-sun';
                icon.style.color = '#fdd663';
            }

            // Accordion functionality
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', () => {
                    const section = header.closest('.doc-section');
                    section.classList.toggle('is-open');
                    header.classList.toggle('active');
                });
            });
        });
    </script>

<div class="toast-container" id="toastContainer"></div>
</body>
</html>
