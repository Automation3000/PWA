<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Library - Automation App</title>
    <!-- Reusing styles from index.html for consistency -->
    <link rel="icon" href="https://cdn.brandfetch.io/idYzxNpaam/w/400/h/400/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&t=1763636632146" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <style>
        :root {
            --primary: #1a73e8; --primary-dark: #0d62d9; --primary-light: #e8f0fe; --secondary: #1e8e3e; --warning: #f9ab00; --danger: #d93025; --dark: #202124; --light: #f8f9fa; --gray: #5f6368; --border: #dadce0; --shadow-sm: 0 1px 4px rgba(0,0,0,.08); --shadow: 0 2px 12px rgba(0,0,0,.10); --radius: 12px; --radius-sm: 8px; --bg-page: #e8f0f8; --bg-card: #ffffff; --bg-surface: #f3f6fb; --text-primary: #202124; --text-secondary: #5f6368; --text-muted: #80868b;
        }
        body.dark-mode {
            --primary: #7baaf7; --primary-light: #1e2d45; --secondary: #34c779; --warning: #fdd663; --danger: #f28b82; --dark: #e8eaed; --light: #2d2f31; --gray: #9aa0a6; --border: #3c3f43; --bg-page: #111213; --bg-card: #1e2022; --bg-surface: #2d2f31; --text-primary: #e8eaed; --text-secondary: #9aa0a6; --text-muted: #6e7275;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-page); color: var(--text-primary); line-height: 1.5; }
        .app-container { max-width:1200px; margin:0 auto; padding: 1rem; }
        .app-header { background: var(--bg-card); padding: 1rem 1.5rem; border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
        .header-content { display:flex; align-items:center; justify-content:space-between; }
        .brand { display:flex; align-items:center; gap:.75rem; }
        .logo { width:42px; height:42px; background:white; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:var(--shadow-sm); border:1px solid var(--border); flex-shrink:0; }
        .search-container { padding:1rem; margin:1rem 0; background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border); }
        .search-box { position:relative; }
        .search-box input { width:100%; padding:.8rem 1rem .8rem 3rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:16px; background:var(--bg-surface); color:var(--text-primary); outline:none; transition:border-color .2s; }
        .search-box input:focus { border-color:var(--primary); }
        .search-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--text-muted); }
        .doc-section { background: var(--bg-card); margin: 1.5rem 0; padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .doc-section h2 { font-size: 1.2rem; color: var(--text-primary); border-bottom: 1px solid var(--border); padding-bottom: .5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }
        .doc-list { list-style: none; }
        .doc-list li { margin-bottom: .75rem; }
        .doc-list a { color: var(--primary); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: .5rem; transition: color .2s; }
        .doc-list a:hover { color: var(--primary-dark); }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
        .media-item img, .media-item video { width: 100%; height: auto; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .2s; }
        .media-item img:hover, .media-item video:hover { transform: scale(1.05); }
        .media-item p { font-size: .8rem; text-align: center; color: var(--text-secondary); margin-top: .5rem; font-weight: 600; }
        .no-results { text-align: center; padding: 2rem; color: var(--text-muted); }
        
        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            border: none;
            box-shadow: var(--shadow-md);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            transition: transform .2s, background-color .2s;
        }
        .fab:hover { transform: scale(1.08); background-color: var(--primary-dark); }
        
        /* Accordion styles */
        .accordion-header { cursor: pointer; transition: background-color .2s; display: flex; justify-content: space-between; align-items: center; }
        .accordion-header:hover { background-color: var(--bg-surface); }
        .accordion-header .accordion-icon { transition: transform .3s; }
        .accordion-header.active .accordion-icon { transform: rotate(180deg); }
        .accordion-content { display: none; padding-top: 1rem; animation: fadeIn .4s ease; }
        .doc-section.is-open .accordion-content { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Iframe styles */
        .drive-iframe { width: 100%; height: 450px; border: 1px solid var(--border); border-radius: var(--radius-sm); }

        /* Modal styles for consistency */
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); display:none; z-index:9999; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--bg-card); width:95%; max-width:500px; border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.25); border:1px solid var(--border); }
        .modal-header { padding:1.1rem 1.4rem; background:var(--primary); color:white; display:flex; justify-content:space-between; align-items:center; }
        .modal-header h3 { font-size:1rem; font-weight:700; }
        .modal-body { padding:1.5rem; }
        .form-group { margin-bottom:1.2rem; }
        .form-group label { display:block; margin-bottom:.4rem; font-weight:600; font-size:.85rem; }
        .modal-actions { display:flex; gap:.8rem; margin-top:1.2rem; }
        .btn-primary { flex:1; padding:.9rem; background:var(--primary); color:white; border:none; border-radius:var(--radius-sm); font-weight:700; cursor:pointer; font-size:.9rem; transition:.2s; }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-secondary { flex:1; padding:.9rem; background:var(--bg-surface); color:var(--text-primary); border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; font-weight:600; font-size:.9rem; transition:.2s; }
        .btn-secondary:hover { border-color:var(--primary); }

        /* Dark Mode specific styles */
        body.dark-mode .app-header, body.dark-mode .doc-section { background: var(--bg-card) !important; border-color: var(--border) !important; }
        body.dark-mode .doc-section h2 { color: var(--text-primary) !important; border-color: var(--border) !important; }
        body.dark-mode .accordion-header:hover { background-color: var(--bg-surface) !important; }
        body.dark-mode .doc-list a { color: var(--primary) !important; }
        body.dark-mode .media-item p { color: var(--text-secondary) !important; }
        body.dark-mode .modal { background: var(--bg-card); border-color: var(--border); }
        body.dark-mode .form-group label { color: var(--text-primary); }
        body.dark-mode .btn-secondary { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border); }
        body.dark-mode #fileUploadInput { background: var(--bg-surface); border-color: var(--border); color: var(--text-primary); }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <div class="brand">
                <button onclick="window.location.href='index.html'" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--primary);padding-right:10px;"><i class="fas fa-arrow-left"></i></button>
                <div class="logo">
                    <img src="icon-192.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;" onerror="this.src='https://tabreed.automation3000.com/icon-192.png'">
                </div>
                <div>
                    <h1 style="font-size:1rem;font-weight:700;color:var(--text-primary);">Document Library</h1>
                    <p style="font-size:.7rem;color:var(--text-muted);">Shared Files & Media</p>
                </div>
            </div>
            <i class="fas fa-moon" id="darkModeToggleBtn" style="cursor:pointer;font-size:17px;color:var(--text-muted);" onclick="toggleDarkMode()" title="Toggle Dark Mode"></i>
        </div>
    </header>

    <div class="app-container">
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="docSearchInput" placeholder="Use the search inside each section below..." readonly style="cursor: not-allowed; background: var(--bg-surface) !important;">
            </div>
        </div>

        <!-- PDF Section -->
        <div class="doc-section">
            <h2 class="accordion-header">
                <span><i class="fas fa-file-pdf" style="color:var(--danger)"></i> PDF Documents</span>
                <i class="fas fa-chevron-down accordion-icon"></i>
            </h2>
            <div class="accordion-content">
                <iframe class="drive-iframe" src="https://drive.google.com/embeddedfolderview?id=1CZIU9gxrpYA3gO1Kf6trVfkpilt7aOMJ#grid" loading="lazy"></iframe>
            </div>
        </div>

        <!-- Images Section -->
        <div class="doc-section">
            <h2 class="accordion-header">
                <span><i class="fas fa-file-image" style="color:var(--secondary)"></i> Image Gallery</span>
                <i class="fas fa-chevron-down accordion-icon"></i>
            </h2>
            <div class="accordion-content">
                <iframe class="drive-iframe" src="https://drive.google.com/embeddedfolderview?id=1_4z-Gyuvpm42SYBKwcEXsBvGzLWtUJAt#grid" loading="lazy"></iframe>
            </div>
        </div>

        <!-- Videos Section -->
        <div class="doc-section">
            <h2 class="accordion-header">
                <span><i class="fas fa-file-video" style="color:var(--primary)"></i> Video Tutorials</span>
                <i class="fas fa-chevron-down accordion-icon"></i>
            </h2>
            <div class="accordion-content">
                <iframe class="drive-iframe" src="https://drive.google.com/embeddedfolderview?id=1Ome7auV6yg2jCzZaJPs4kmPj_E3UZJpp#grid" loading="lazy"></iframe>
            </div>
        </div>

    </div>

    <!-- Floating Action Button for Upload -->
    <button class="fab" onclick="openUploadModal()" title="Upload a File">
        <i class="fas fa-upload"></i>
    </button>

    <!-- UPLOAD MODAL -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-cloud-upload-alt"></i> Upload to Library</h3>
                <button onclick="closeUploadModal()" style="background:none;border:none;cursor:pointer;font-size:1.5rem;color:white;line-height:1;">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="fileUploadInput">Select a PDF, Image, or Video file</label>
                    <input type="file" id="fileUploadInput" accept=".pdf,image/*,video/*" style="width:100%; padding: 1rem; border: 2px dashed var(--border); background: var(--bg-surface); border-radius: var(--radius-sm); text-align: center; cursor: pointer;">
                </div>
                <div id="upload-progress" style="display:none; text-align:center; margin-top:1rem; color: var(--primary); font-weight: 600;">
                    <p><i class="fas fa-spinner fa-spin"></i> Uploading, please wait...</p>
                    <p style="font-size: .8rem; color: var(--text-muted);">(This may take a moment for large files)</p>
                </div>
                <div class="modal-actions">
                    <button class="btn-primary" onclick="handleFileUpload()" id="submitUploadBtn">UPLOAD FILE</button>
                    <button class="btn-secondary" onclick="closeUploadModal()">CANCEL</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwnUqgWqfPwnPLtmsSXvXfqNj66wcOjVoft3ou_t4RDBQ-Iscyp3wuiv45Z1o9UND6OZQ/exec";

        // Simple dark mode toggle to maintain theme consistency
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('tabreed_dark_mode', isDark ? '1' : '0');
            const icon = document.getElementById('darkModeToggleBtn');
            icon.className  = isDark ? 'fas fa-sun' : 'fas fa-moon';
            icon.style.color = isDark ? '#fdd663' : '#9aa0a6';
        }

        // --- UPLOAD FUNCTIONALITY ---
        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('fileUploadInput').value = ''; // Reset file input
            document.getElementById('upload-progress').style.display = 'none';
            document.getElementById('submitUploadBtn').disabled = false;
        }

        function handleFileUpload() {
            const fileInput = document.getElementById('fileUploadInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a file to upload.');
                return;
            }

            document.getElementById('upload-progress').style.display = 'block';
            document.getElementById('submitUploadBtn').disabled = true;

            const reader = new FileReader();
            reader.onload = (e) => {
                const fileData = e.target.result.split(',')[1]; // Get Base64 part
                const payload = {
                    filename: file.name,
                    mimeType: file.type,
                    data: fileData
                };

                // Send to Google Apps Script
                fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        alert('File uploaded successfully! It will appear in the library shortly.');
                        // Refresh the iframes to show the new file
                        document.querySelectorAll('.drive-iframe').forEach(iframe => {
                            iframe.src = iframe.src;
                        });
                    } else {
                        throw new Error(result.error || 'Unknown server error.');
                    }
                    closeUploadModal();
                })
                .catch(error => {
                    console.error('Upload Error:', error);
                    alert('Upload failed WORKING on this MODULE: ' + error.message);
                    closeUploadModal();
                });
            };
            reader.readAsDataURL(file);
        }

        // --- INITIALIZE ---
        document.addEventListener('DOMContentLoaded', () => {
            // Restore dark mode on page load
            if (localStorage.getItem('tabreed_dark_mode') === '1') {
                document.body.classList.add('dark-mode');
                const icon = document.getElementById('darkModeToggleBtn');
                icon.className = 'fas fa-sun';
                icon.style.color = '#fdd663';
            }

            // Accordion functionality
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', () => {
                    const section = header.closest('.doc-section');
                    section.classList.toggle('is-open');
                    header.classList.toggle('active');
                });
            });
        });
    </script>

</body>
</html>
