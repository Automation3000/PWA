<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TABREED | Petty Cash Voucher</title>
    <meta name="theme-color" content="#1a2935">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary:        #1a73e8;
            --primary-dark:   #0d62d9;
            --primary-light:  #e8f0fe;
            --secondary:      #1e8e3e;
            --warning:        #f9ab00;
            --danger:         #d93025;
            --dark:           #202124;
            --light:          #f8f9fa;
            --gray:           #5f6368;
            --border:         #dadce0;
            --shadow-sm:      0 1px 4px rgba(0,0,0,.08);
            --shadow:         0 2px 12px rgba(0,0,0,.10);
            --shadow-md:      0 4px 20px rgba(0,0,0,.12);
            --radius:         12px;
            --radius-sm:      8px;
            --transition:     all .25s ease;
            --bg-page:        #e8f0f8;
            --bg-card:        #ffffff;
            --bg-surface:     #f3f6fb;
            --text-primary:   #202124;
            --text-secondary: #5f6368;
            --text-muted:     #80868b;
            --input-bg:       #f8f9fa;
            --header-bg:      #1a2935;
            --header-text:    #ffffff;
            --table-header:   #f1f3f4;
        }

        /* ═══════════════════════════════════════════════════
           DARK MODE / NEON DARK (CYBER DARK)
        ═══════════════════════════════════════════════════ */
        body.dark-mode,
        body.theme-cyber-dark {
            --primary:        #22d3ee;
            --primary-dark:   #0891b2;
            --primary-light:  #164e63;
            --secondary:      #34d399;
            --warning:        #facc15;
            --danger:         #f87171;
            --dark:           #f3f4f6;
            --light:          #1f2937;
            --gray:           #9ca3af;
            --border:         #374151;
            --shadow-sm:      0 1px 4px rgba(0,0,0,.3);
            --shadow:         0 2px 12px rgba(0,0,0,.4);
            --shadow-md:      0 4px 20px rgba(0,0,0,.5);
            --bg-page:        #0f172a;
            --bg-card:        #1e293b;
            --bg-surface:     #334155;
            --text-primary:   #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted:     #94a3b8;
            --input-bg:       #334155;
            --header-bg:      #0284c7;
            --header-text:    #ffffff;
            --table-header:   #334155;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            transition: background-color .25s ease, color .25s ease;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 60px 15px;
        }

        /* ═══════════════════════════════════════════════════
           HEADER — Clean title without icon or subtitle text
        ═══════════════════════════════════════════════════ */
        .app-header {
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            margin: 0 -15px 15px -15px;
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }
        @media (min-width: 1200px) { .app-header { margin: 0 0 15px 0; } }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: .85rem;
            text-decoration: none;
            color: inherit;
        }
        .back-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
        }
        .back-btn:hover {
            background: var(--primary);
            color: #fff;
            transform: scale(1.05);
        }
        .logo {
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        .logo-img { width: 34px; height: 34px; object-fit: contain; }
        .brand-text h1 {
            font-size: 1.18rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            line-height: 1.2;
            margin: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .connection-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            cursor: default;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--secondary);
            transition: background 0.3s ease;
        }
        .status-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
        .status-dot.offline { background: var(--danger); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .btn-icon {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-icon:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ═══════════════════════════════════════════════════
           SEARCH CONTAINER — Matching Master Instrument
        ═══════════════════════════════════════════════════ */
        .search-container {
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .search-box { position: relative; }
        .search-box input {
            width: 100%;
            padding: .8rem 1rem .8rem 3rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: var(--input-bg);
            color: var(--text-primary);
            outline: none;
            transition: border-color .2s;
        }
        .search-box input:focus { border-color: var(--primary); }
        .search-box input::placeholder { color: var(--text-muted); opacity: 1; }
        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        /* ═══════════════════════════════════════════════════
           QUICK ACTIONS — Matching Master Instrument
        ═══════════════════════════════════════════════════ */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-bottom: 1rem;
            justify-content: center;
        }
        .action-btn {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            flex: 1;
            min-width: 80px;
            max-width: 140px;
            padding: .85rem .5rem;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: .75rem;
            font-weight: 700;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            text-align: center;
            user-select: none;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }
        .action-btn i {
            font-size: 1.25rem;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }
        .action-btn:hover i { transform: scale(1.1); }
        .action-btn span {
            color: var(--text-secondary);
            font-size: .72rem;
            text-align: center;
        }
        .action-btn.active {
            background: var(--primary-light) !important;
            border-color: var(--primary) !important;
        }
        .action-btn.active span, .action-btn.active i {
            color: var(--primary) !important;
        }
        .select-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* ═══════════════════════════════════════════════════
           STATUS PILLS / BADGES — Matching Operation Request
           (NO "All" tab - strictly Submitted, Approved, Reimbursed, Rejected)
        ═══════════════════════════════════════════════════ */
        .status-summary-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            align-items: center;
        }
        .status-badge-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: var(--transition);
            border: 1px solid transparent;
            user-select: none;
        }
        .status-badge-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
        .badge-submitted {
            background: rgba(245,158,11,0.12);
            border-color: rgba(245,158,11,0.4);
            color: #d97706;
        }
        body.dark-mode .badge-submitted, body.theme-cyber-dark .badge-submitted { color: #facc15; border-color: rgba(250,204,21,0.4); }
        .badge-submitted.active {
            background: #f59e0b !important;
            color: #0f172a !important;
            border-color: #f59e0b !important;
        }

        .badge-approved {
            background: rgba(16,185,129,0.12);
            border-color: rgba(16,185,129,0.4);
            color: #059669;
        }
        body.dark-mode .badge-approved, body.theme-cyber-dark .badge-approved { color: #34d399; border-color: rgba(52,211,153,0.4); }
        .badge-approved.active {
            background: #10b981 !important;
            color: #0f172a !important;
            border-color: #10b981 !important;
        }

        .badge-reimbursed {
            background: rgba(13,148,136,0.12);
            border-color: rgba(13,148,136,0.4);
            color: #0d9488;
        }
        body.dark-mode .badge-reimbursed, body.theme-cyber-dark .badge-reimbursed { color: #2dd4bf; border-color: rgba(45,212,191,0.4); }
        .badge-reimbursed.active {
            background: #0d9488 !important;
            color: #ffffff !important;
            border-color: #0d9488 !important;
        }

        .badge-rejected {
            background: rgba(239,68,68,0.12);
            border-color: rgba(239,68,68,0.4);
            color: #dc2626;
        }
        body.dark-mode .badge-rejected, body.theme-cyber-dark .badge-rejected { color: #f87171; border-color: rgba(248,113,113,0.4); }
        .badge-rejected.active {
            background: #ef4444 !important;
            color: #ffffff !important;
            border-color: #ef4444 !important;
        }

        .badge-count {
            background: rgba(0,0,0,0.15);
            padding: 2px 7px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 900;
        }
        body.dark-mode .badge-count, body.theme-cyber-dark .badge-count {
            background: rgba(255,255,255,0.15);
        }

        /* ═══════════════════════════════════════════════════
           TABLE & CARDS
        ═══════════════════════════════════════════════════ */
        .card-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 14px;
            font-size: .84rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        th {
            background: var(--table-header);
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            font-size: .72rem;
            letter-spacing: .4px;
            white-space: nowrap;
        }
        tbody tr:hover { background: var(--bg-surface); }
        tbody tr:last-child td { border-bottom: none; }

        .voucher-id-cell {
            font-family: monospace;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        .voucher-id-cell:hover { text-decoration: underline; }

        .amount-badge {
            display: inline-block;
            background: rgba(16,185,129,0.12);
            color: #059669;
            font-weight: 800;
            font-size: 0.88rem;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(16,185,129,0.3);
            white-space: nowrap;
        }
        body.dark-mode .amount-badge, body.theme-cyber-dark .amount-badge {
            color: #34d399;
            background: rgba(52,211,153,0.12);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: capitalize;
            white-space: nowrap;
        }
        .status-pill.status-submitted  { background: rgba(245,158,11,0.15); color: #d97706; border: 1px solid rgba(245,158,11,0.3); }
        .status-pill.status-approved   { background: rgba(16,185,129,0.15); color: #059669; border: 1px solid rgba(16,185,129,0.3); }
        .status-pill.status-reimbursed { background: rgba(13,148,136,0.15); color: #0d9488; border: 1px solid rgba(13,148,136,0.3); }
        .status-pill.status-rejected   { background: rgba(239,68,68,0.15); color: #dc2626; border: 1px solid rgba(239,68,68,0.3); }
        body.dark-mode .status-pill.status-submitted, body.theme-cyber-dark .status-pill.status-submitted { color: #facc15; }
        body.dark-mode .status-pill.status-approved, body.theme-cyber-dark .status-pill.status-approved { color: #34d399; }
        body.dark-mode .status-pill.status-reimbursed, body.theme-cyber-dark .status-pill.status-reimbursed { color: #2dd4bf; }
        body.dark-mode .status-pill.status-rejected, body.theme-cyber-dark .status-pill.status-rejected { color: #f87171; }

        .receipt-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }
        .receipt-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        .action-btns {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-table-action {
            background: none;
            border: none;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .btn-table-action:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
        }
        .btn-table-action.delete:hover {
            color: var(--danger);
            background: rgba(239,68,68,0.1);
        }

        /* ═══════════════════════════════════════════════════
           MODAL STYLES
        ═══════════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 520px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: modalIn 0.2s ease-out;
            max-height: 90vh;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header {
            padding: 14px 18px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 1rem;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover {
            background: #ef4444;
            color: #fff;
        }
        .modal-body {
            padding: 16px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row > * { flex: 1; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color .2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--primary);
        }
        .currency-input {
            position: relative;
        }
        .currency-input span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 800;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .currency-input input {
            padding-left: 50px;
            font-weight: 700;
            font-size: 1rem;
            color: #10b981;
        }
        .receipt-preview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            border: 1px dashed var(--border);
            object-fit: contain;
            background: rgba(0,0,0,0.05);
            margin-top: 6px;
            display: none;
        }
        .modal-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: var(--bg-surface);
        }

        .btn-modal-cancel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-modal-submit {
            background: #0284c7;
            border: none;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .btn-modal-submit:hover {
            filter: brightness(1.1);
        }

        /* ═══════════════════════════════════════════════════
           TOAST NOTIFICATIONS
        ═══════════════════════════════════════════════════ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            animation: slideUp 0.2s ease-out;
            max-width: 320px;
        }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.info    { border-left: 4px solid #0284c7; }
        .toast.warning { border-left: 4px solid #f59e0b; }
        .toast.error   { border-left: 4px solid #ef4444; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @media (max-width: 640px) {
            .app-container { padding: 0 10px 60px 10px; }
            .quick-actions { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 8px !important; }
            .action-btn { max-width: unset !important; min-width: unset !important; width: 100% !important; min-height: 70px !important; }
            th, td { padding: 8px 10px; font-size: 0.78rem; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER — Clean title without icon or subtitle text -->
        <header class="app-header">
            <div class="header-content">
                <div class="brand">
                    <button class="back-btn" onclick="window.location.href='index.html'" title="Back to Launchpad">

    <!-- TOAST CONTAINER -->

    <!-- Centralized Auth Module Integration -->
    <script src="auth-module.js"></script>

    <script>
        // ─────────────────────────────────────────────────────────────
        // APP STATE & CONSTANTS
        // ─────────────────────────────────────────────────────────────
        const LS_KEY_PETTY = 'tabreed_petty_cash_vouchers';
        const THEME_KEY = 'tabreed_selected_theme';
        const LS_DARK = 'tabreed_dark_mode';

        let allVouchers = [];
        let filteredVouchers = [];
        let activeStatusFilter = null; // null = all visible, or 'Submitted', 'Approved', etc.
        let activeTechFilter = 'all';
        let currentUser = null;
        let selectedReceiptDataUrl = '';
        let isSyncing = false;

        // ─────────────────────────────────────────────────────────────
        // THEME MANAGEMENT — Light default, Neon Dark toggle, Global Sync
        // ─────────────────────────────────────────────────────────────
        const ALL_THEME_CLASSES = [
            'dark-mode', 'theme-ocean-blue', 'theme-industrial',
            'theme-emerald-forest', 'theme-royal-purple', 'theme-crimson-red',
            'theme-nordic-teal', 'theme-slate-minimal', 'theme-cyber-dark'
        ];

        function applyTheme() {
            const themeId = localStorage.getItem(THEME_KEY) || localStorage.getItem('tabreed_pwa_theme') || (localStorage.getItem(LS_DARK) === '1' ? 'cyber-dark' : 'default');
            document.body.classList.remove(...ALL_THEME_CLASSES);
            document.documentElement.classList.remove(...ALL_THEME_CLASSES);

            if (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark') {
                document.body.classList.add('dark-mode');
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('theme-cyber-dark');
            }
            if (themeId && themeId !== 'default' && themeId !== 'dark-mode') {
                const finalTheme = themeId.startsWith('theme-') ? themeId : `theme-${themeId}`;
                document.body.classList.add(finalTheme);
                document.documentElement.classList.add(finalTheme);
            }

            const isDark = (themeId === 'dark-mode' || themeId === 'cyber-dark' || themeId === 'theme-cyber-dark');
            const icon = document.querySelector('#darkModeToggleBtn i');
            if (icon) {
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
                icon.style.color = isDark ? '#fdd663' : 'var(--text-primary)';
            }
        }

        function toggleDarkMode() {
            const isCurrentlyDark = document.body.classList.contains('dark-mode') || document.body.classList.contains('theme-cyber-dark');
            const nextTheme = isCurrentlyDark ? 'default' : 'cyber-dark';
            localStorage.setItem(LS_DARK, isCurrentlyDark ? '0' : '1');
            localStorage.setItem(THEME_KEY, nextTheme);
            localStorage.setItem('tabreed_pwa_theme', nextTheme);
            localStorage.setItem('tabreed_selected_theme', nextTheme);
            applyTheme();
            showToast(isCurrentlyDark ? 'Light Mode Enabled' : 'Neon Dark Enabled', 'info');
        }

        // Synchronize themes across any open tabs/windows
        window.addEventListener('storage', (e) => {
            if (e.key === THEME_KEY || e.key === 'tabreed_pwa_theme' || e.key === LS_DARK) {
                applyTheme();
            }
        });

        // Today formatted for HTML date input: YYYY-MM-DD
        function getTodayISO() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // Format DD.MM.YYYY
        function formatDisplayDate(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('-')) {
                const parts = dateStr.split('-');
                if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            return dateStr;
        }

        // ─────────────────────────────────────────────────────────────
        // VOUCHER ID GENERATOR: PCV-DDMMYY-XX
        // Starts at 01 every month, sequential 01, 02, 03... no duplicates
        // ─────────────────────────────────────────────────────────────
        function generateSequentialVoucherId(dateInputVal) {
            let now = new Date();
            let d = now.getDate(), m = now.getMonth() + 1, y = now.getFullYear();

            if (dateInputVal) {
                if (dateInputVal.includes('-')) {
                    const p = dateInputVal.split('-');
                    if (p.length === 3) {
                        y = parseInt(p[0], 10) || y;
                        m = parseInt(p[1], 10) || m;
                        d = parseInt(p[2], 10) || d;
                    }
                } else if (dateInputVal.includes('.')) {
                    const p = dateInputVal.split('.');
                    if (p.length === 3) {
                        d = parseInt(p[0], 10) || d;
                        m = parseInt(p[1], 10) || m;
                        y = parseInt(p[2], 10) || y;
                    }
                }
            }

            const dd = String(d).padStart(2, '0');
            const mm = String(m).padStart(2, '0');
            const yy = String(y).slice(-2);
            const monthKey = `${mm}${yy}`; // e.g. "1126"

            // Collect all used numbers in this month from all existing vouchers
            const usedNumbers = new Set();
            allVouchers.forEach(v => {
                const vid = String(v.voucherId || v.id || '').trim();
                const match = vid.match(/^PCV-\d{2}(\d{4})-(\d+)$/);
                if (match && match[1] === monthKey) {
                    const num = parseInt(match[2], 10);
                    if (!isNaN(num) && num > 0) usedNumbers.add(num);
                }
            });

            let seq = 1;
            while (usedNumbers.has(seq)) {
                seq++;
            }
            const padXX = String(seq).padStart(2, '0');
            return `PCV-${dd}${mm}${yy}-${padXX}`;
        }

        function onPurchaseDateChange() {
            const pDateInput = document.getElementById('purchaseDate').value;
            const editId = document.getElementById('editVoucherId').value;
            if (!editId) {
                const previewEl = document.getElementById('previewVoucherId');
                if (previewEl) previewEl.value = generateSequentialVoucherId(pDateInput);
            }
        }

        // ─────────────────────────────────────────────────────────────
        // AUTHENTICATION & ROLE DETECTION
        // ─────────────────────────────────────────────────────────────
        function isSupervisorOrDev() {
            if (!currentUser) return false;
            const r = String(currentUser.role || '').toLowerCase();
            return r === 'supervisor' || r === 'developer' || r === 'super_admin' || r === 'admin';
        }

        function checkUserAuth() {
            if (window.TabreedAuth) {
                currentUser = TabreedAuth.getUser();
                TabreedAuth.onAuthChange((user) => {
                    currentUser = user;
                    updateUserUI();
                    applyRoleRestrictions();
                });
            } else {
                try {
                    const saved = localStorage.getItem('tabreed_currentUser') || localStorage.getItem('tabreed_admin_user');
                    if (saved) currentUser = JSON.parse(saved);
                } catch(e) {}
            }
            updateUserUI();
            applyRoleRestrictions();
        }

        function updateUserUI() {
            const loginBtn = document.getElementById('header-login-btn');
            const userBtn = document.getElementById('header-user-btn');
            const userNameSpan = document.getElementById('headerUserName');

            if (currentUser && (currentUser.code || currentUser.short)) {
                if (loginBtn) loginBtn.style.display = 'none';
                if (userBtn) {
                    userBtn.style.display = 'inline-flex';
                    if (userNameSpan) userNameSpan.textContent = currentUser.short || currentUser.full || 'User';
                }
            } else {
                if (loginBtn) loginBtn.style.display = 'inline-flex';
                if (userBtn) userBtn.style.display = 'none';
            }
        }

        function applyRoleRestrictions() {
            const isSup = isSupervisorOrDev();
            const techBtn = document.getElementById('techFilterActionBtn');
            const supervisorApprovalSection = document.getElementById('supervisorApprovalSection');

            if (techBtn) techBtn.style.display = isSup ? 'flex' : 'none';
            if (supervisorApprovalSection) supervisorApprovalSection.style.display = isSup ? 'block' : 'none';

            populateTechFilterDropdown();
            renderVouchersTable();
        }

        function populateTechFilterDropdown() {
            const select = document.getElementById('techFilterSelect');
            if (!select) return;

            const existingVal = select.value;
            select.innerHTML = '<option value="all">All Technicians</option>';

            const techSet = new Map();
            allVouchers.forEach(v => {
                const name = v.userName || v.user || 'Unknown';
                const code = v.empCode || v.employeeCode || '';
                const key = code ? `${name} (${code})` : name;
                techSet.set(code || name, key);
            });

            techSet.forEach((label, val) => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = label;
                select.appendChild(opt);
            });

            if (existingVal && techSet.has(existingVal)) {
                select.value = existingVal;
            }
        }

        // ─────────────────────────────────────────────────────────────
        // DATA LOADING & SILENT SYNC ENGINE
        // ─────────────────────────────────────────────────────────────
        async function loadInitialData() {
            try {
                const cached = localStorage.getItem(LS_KEY_PETTY);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        allVouchers = parsed;
                        renderVouchersTable();
                    }
                }
            } catch(e) {}

            await silentBackgroundSync();
        }

        async function silentBackgroundSync() {
            if (isSyncing) return;
            isSyncing = true;
            updateConnectionStatus('syncing');

            try {
                const res = await fetch('/api/petty-cash?t=' + Date.now()).then(r => r.json());
                if (res && res.status === 'success' && Array.isArray(res.data)) {
                    allVouchers = res.data;
                    localStorage.setItem(LS_KEY_PETTY, JSON.stringify(allVouchers));
                    updateConnectionStatus('online');
                    populateTechFilterDropdown();
                    renderVouchersTable();
                } else {
                    updateConnectionStatus(navigator.onLine ? 'online' : 'offline');
                }
            } catch(err) {
                updateConnectionStatus(navigator.onLine ? 'online' : 'offline');
            } finally {
                isSyncing = false;
            }
        }

        async function manualRefresh() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('fa-spin');
            showToast('Refreshing petty cash vouchers...', 'info');

            await silentBackgroundSync();

            setTimeout(() => {
                if (icon) icon.classList.remove('fa-spin');
                showToast('All vouchers are up to date!', 'success');
            }, 500);
        }

        function updateConnectionStatus(state) {
            const dot = document.getElementById('statusDot');
            if (!dot) return;

            dot.className = 'status-dot';
            if (state === 'syncing') {
                dot.classList.add('syncing');
            } else if (state === 'offline' || !navigator.onLine) {
                dot.classList.add('offline');
            }
        }

        // ─────────────────────────────────────────────────────────────
        // TABLE RENDERING & FILTERING
        // ─────────────────────────────────────────────────────────────
        function renderVouchersTable() {
            const tbody = document.getElementById('vouchersTableBody');
            if (!tbody) return;

            const isSup = isSupervisorOrDev();
            const curCode = currentUser ? String(currentUser.code || currentUser.empId || '').trim() : '';
            const curShort = currentUser ? String(currentUser.short || '').trim().toLowerCase() : '';
            const curFull = currentUser ? String(currentUser.full || '').trim().toLowerCase() : '';

            // Step 1: Role-based filtering
            let accessible = allVouchers;
            if (!isSup) {
                accessible = allVouchers.filter(v => {
                    const vCode = String(v.empCode || v.employeeCode || '').trim();
                    const vUser = String(v.user || '').trim().toLowerCase();
                    const vName = String(v.userName || '').trim().toLowerCase();

                    if (curCode && vCode && vCode === curCode) return true;
                    if (curShort && (vUser === curShort || vName.includes(curShort))) return true;
                    if (curFull && (vName === curFull || vName.includes(curFull))) return true;
                    return false;
                });
            }

            // Step 2: Technician Dropdown Filter (Supervisor Only)
            if (isSup && activeTechFilter !== 'all') {
                accessible = accessible.filter(v => {
                    const vCode = String(v.empCode || v.employeeCode || '').trim();
                    const vName = String(v.userName || v.user || '').trim();
                    return vCode === activeTechFilter || vName === activeTechFilter;
                });
            }

            // Step 3: Status Filter Pills (Submitted, Approved, Reimbursed, Rejected)
            if (activeStatusFilter) {
                accessible = accessible.filter(v => (v.status || 'Submitted').toLowerCase() === activeStatusFilter.toLowerCase());
            }

            // Step 4: Search Filter
            const searchVal = (document.getElementById('voucherSearchInput')?.value || '').trim().toLowerCase();
            if (searchVal) {
                accessible = accessible.filter(v => {
                    const id = String(v.voucherId || v.id || '').toLowerCase();
                    const item = String(v.item || v.description || '').toLowerCase();
                    const user = String(v.userName || v.user || '').toLowerCase();
                    const amount = String(v.amount || '').toLowerCase();
                    const date = String(v.dateOfPurchase || v.date || '').toLowerCase();
                    return id.includes(searchVal) || item.includes(searchVal) || user.includes(searchVal) || amount.includes(searchVal) || date.includes(searchVal);
                });
            }

            filteredVouchers = accessible;
            updateStatusPillCounts();

            if (filteredVouchers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);">
                    <i class="fas fa-inbox" style="font-size:2rem; margin-bottom:10px; display:block; opacity:0.35;"></i>
                    No petty cash vouchers found. Click <strong>"Log Cash"</strong> to record an expense claim.
                </td></tr>`;
                return;
            }

            tbody.innerHTML = filteredVouchers.map(v => buildTableRow(v)).join('');
        }

        function buildTableRow(v) {
            const vId = v.voucherId || v.id || '-';
            const dateStr = formatDisplayDate(v.dateOfPurchase || v.date);
            const amountVal = parseFloat(v.amount) || 0;
            const amountFormatted = 'AED ' + amountVal.toFixed(2);
            const itemText = escapeHTML(v.item || v.description || '-');
            const userName = escapeHTML(v.userName || v.user || 'Technician');
            const empCode = v.empCode || v.employeeCode || '';
            const status = v.status || 'Submitted';
            const statusClass = `status-${status.toLowerCase()}`;

            const hasReceipt = Boolean(v.receiptUrl);
            const receiptHtml = hasReceipt
                ? `<button class="receipt-btn" onclick="openReceiptModal('${escapeHTML(v.receiptUrl)}', '${escapeHTML(vId)}')"><i class="fas fa-file-invoice"></i> View</button>`
                : `<span style="color:var(--text-muted); font-size:0.75rem; opacity:0.4;">None</span>`;

            const isSup = isSupervisorOrDev();
            const curCode = currentUser ? String(currentUser.code || '').trim() : '';
            const isOwner = empCode && curCode && empCode === curCode;
            const canEdit = isSup || (isOwner && status === 'Submitted');

            let actionsHtml = `
                <div class="action-btns">
                    ${canEdit ? `<button class="btn-table-action" onclick="openEditModal('${escapeHTML(vId)}')" title="Edit Voucher"><i class="fas fa-edit"></i></button>` : ''}
                    ${canEdit ? `<button class="btn-table-action delete" onclick="deleteVoucher('${escapeHTML(vId)}')" title="Delete Voucher"><i class="fas fa-trash-alt"></i></button>` : ''}
                    <button class="btn-table-action" onclick="printVoucherSlip('${escapeHTML(vId)}')" title="Print Voucher Slip"><i class="fas fa-print"></i></button>
                </div>
            `;

            return `
                <tr>
                    <td><span class="voucher-id-cell" onclick="copyVoucherId('${escapeHTML(vId)}')" title="Click to copy">${escapeHTML(vId)}</span></td>
                    <td style="white-space:nowrap;">${escapeHTML(dateStr)}</td>
                    <td style="font-weight:600;">${itemText}</td>
                    <td><span class="amount-badge">${amountFormatted}</span></td>
                    <td>
                        <div style="font-weight:700;">${userName}</div>
                        ${empCode ? `<span style="font-size:0.72rem; color:var(--text-muted);">${escapeHTML(empCode)}</span>` : ''}
                    </td>
                    <td style="text-align:center;">${receiptHtml}</td>
                    <td>
                        <span class="status-pill ${statusClass}">
                            <i class="fas ${status === 'Approved' ? 'fa-check' : (status === 'Reimbursed' ? 'fa-money-bill-wave' : (status === 'Rejected' ? 'fa-times' : 'fa-clock'))}"></i>
                            ${escapeHTML(status)}
                        </span>
                    </td>
                    <td style="text-align:right;">${actionsHtml}</td>
                </tr>
            `;
        }

        function updateStatusPillCounts() {
            const counts = { Submitted: 0, Approved: 0, Reimbursed: 0, Rejected: 0 };

            const isSup = isSupervisorOrDev();
            const curCode = currentUser ? String(currentUser.code || '').trim() : '';
            const curShort = currentUser ? String(currentUser.short || '').trim().toLowerCase() : '';

            const accessible = isSup ? allVouchers : allVouchers.filter(v => {
                const vCode = String(v.empCode || v.employeeCode || '').trim();
                const vUser = String(v.user || '').trim().toLowerCase();
                return (curCode && vCode === curCode) || (curShort && vUser === curShort);
            });

            accessible.forEach(v => {
                const s = v.status || 'Submitted';
                if (counts[s] !== undefined) counts[s]++;
            });

            document.getElementById('countSubmitted').textContent = counts.Submitted;
            document.getElementById('countApproved').textContent = counts.Approved;
            document.getElementById('countReimbursed').textContent = counts.Reimbursed;
            document.getElementById('countRejected').textContent = counts.Rejected;
        }

        function toggleStatusFilter(status) {
            if (activeStatusFilter === status) {
                activeStatusFilter = null; // Toggle off if clicked again
            } else {
                activeStatusFilter = status;
            }

            // Update active styling
            ['Submitted', 'Approved', 'Reimbursed', 'Rejected'].forEach(s => {
                const btn = document.getElementById(`pill-${s.toLowerCase()}`);
                if (btn) {
                    if (activeStatusFilter === s) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });

            renderVouchersTable();
        }

        // ─────────────────────────────────────────────────────────────
        // MODAL & CLAIM SUBMISSION
        // ─────────────────────────────────────────────────────────────
        function handleLogCashClick() {
            // Require login before logging cash
            if (!currentUser || (!currentUser.code && !currentUser.short)) {
                showToast("Please login first to log a cash claim", "warning");
                if (window.TabreedAuth) {
                    TabreedAuth.showLoginModal();
                }
                return;
            }
            openClaimModal();
        }

        function openClaimModal() {
            document.getElementById('editVoucherId').value = '';
            document.getElementById('modalTitle').textContent = 'Log Petty Cash Claim';
            document.getElementById('saveBtnText').textContent = 'Save Voucher Claim';

            const today = getTodayISO();
            document.getElementById('purchaseDate').value = today;
            document.getElementById('cashAmount').value = '';
            document.getElementById('itemDescription').value = '';
            document.getElementById('billFileInput').value = '';
            document.getElementById('receiptDriveUrl').value = '';
            document.getElementById('billPreviewImg').style.display = 'none';
            document.getElementById('supervisorRemarks').value = '';
            document.getElementById('voucherStatusSelect').value = 'Submitted';
            selectedReceiptDataUrl = '';

            const userName = currentUser ? (currentUser.short || currentUser.full || 'Majeed') : 'Technician';
            const empCode = currentUser ? (currentUser.code || '41764') : '';
            document.getElementById('loggedByUser').value = userName;
            document.getElementById('loggedByCode').value = empCode;

            // Generate sequential ID preview PCV-DDMMYY-XX
            document.getElementById('previewVoucherId').value = generateSequentialVoucherId(today);

            document.getElementById('voucherModal').classList.add('active');
        }

        function openEditModal(voucherId) {
            const v = allVouchers.find(item => (item.voucherId || item.id) === voucherId);
            if (!v) return;

            document.getElementById('editVoucherId').value = voucherId;
            document.getElementById('modalTitle').textContent = 'Edit Voucher ' + voucherId;
            document.getElementById('saveBtnText').textContent = 'Update Voucher';

            let pDate = v.dateOfPurchase || v.date || '';
            if (pDate.includes('.')) {
                const parts = pDate.split('.');
                if (parts.length === 3) pDate = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
            }
            document.getElementById('purchaseDate').value = pDate || getTodayISO();
            document.getElementById('cashAmount').value = v.amount || '';
            document.getElementById('itemDescription').value = v.item || v.description || '';
            document.getElementById('loggedByUser').value = v.userName || v.user || '';
            document.getElementById('loggedByCode').value = v.empCode || v.employeeCode || '';
            document.getElementById('previewVoucherId').value = voucherId;
            document.getElementById('receiptDriveUrl').value = (v.receiptUrl && !v.receiptUrl.startsWith('data:')) ? v.receiptUrl : '';
            document.getElementById('supervisorRemarks').value = v.remarks || '';
            document.getElementById('voucherStatusSelect').value = v.status || 'Submitted';

            if (v.receiptUrl && v.receiptUrl.startsWith('data:')) {
                selectedReceiptDataUrl = v.receiptUrl;
                const prev = document.getElementById('billPreviewImg');
                prev.src = v.receiptUrl;
                prev.style.display = 'block';
            } else {
                selectedReceiptDataUrl = '';
                document.getElementById('billPreviewImg').style.display = 'none';
            }

            document.getElementById('voucherModal').classList.add('active');
        }

        function closeVoucherModal() {
            document.getElementById('voucherModal').classList.remove('active');
        }

        function handleBillFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedReceiptDataUrl = e.target.result;
                    const preview = document.getElementById('billPreviewImg');
                    if (preview && file.type.startsWith('image/')) {
                        preview.src = selectedReceiptDataUrl;
                        preview.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        async function handleSaveVoucher() {
            const editId = document.getElementById('editVoucherId').value;
            const pDateInput = document.getElementById('purchaseDate').value;
            const amountInput = parseFloat(document.getElementById('cashAmount').value);
            const itemInput = document.getElementById('itemDescription').value.trim();

            if (!pDateInput) {
                showToast('Please select the date of purchase', 'warning');
                return;
            }
            if (!amountInput || amountInput <= 0) {
                showToast('Please enter a valid cash amount', 'warning');
                return;
            }
            if (!itemInput) {
                showToast('Please enter item name or note', 'warning');
                return;
            }

            const driveUrl = document.getElementById('receiptDriveUrl').value.trim();
            const receiptFinal = driveUrl || selectedReceiptDataUrl || '';

            const userName = document.getElementById('loggedByUser').value.trim() || 'Technician';
            const empCode = document.getElementById('loggedByCode').value.trim() || '';
            const status = document.getElementById('voucherStatusSelect').value || 'Submitted';
            const remarks = document.getElementById('supervisorRemarks').value.trim();

            const isEdit = Boolean(editId);
            const voucherId = isEdit ? editId : generateSequentialVoucherId(pDateInput);

            const payload = {
                id: voucherId,
                voucherId: voucherId,
                dateOfPurchase: formatDisplayDate(pDateInput),
                date: formatDisplayDate(pDateInput),
                amount: amountInput,
                item: itemInput,
                description: itemInput,
                user: userName,
                userName: userName,
                empCode: empCode,
                employeeCode: empCode,
                receiptUrl: receiptFinal,
                status: status,
                remarks: remarks,
                timestamp: UtilitiesFormatNow()
            };

            // Optimistic update
            if (isEdit) {
                const idx = allVouchers.findIndex(v => (v.voucherId || v.id) === editId);
                if (idx !== -1) allVouchers[idx] = { ...allVouchers[idx], ...payload };
            } else {
                allVouchers.unshift(payload);
            }
            localStorage.setItem(LS_KEY_PETTY, JSON.stringify(allVouchers));
            renderVouchersTable();
            closeVoucherModal();
            showToast(isEdit ? 'Voucher updated successfully!' : 'Voucher claim submitted successfully!', 'success');

            // Send to backend
            try {
                const endpoint = isEdit ? `/api/petty-cash/${encodeURIComponent(editId)}` : '/api/petty-cash';
                const method = isEdit ? 'PUT' : 'POST';
                await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch(e) {
                console.warn('[Petty Cash] Offline sync fallback:', e);
            }
        }

        async function deleteVoucher(voucherId) {
            if (!confirm(`Are you sure you want to delete voucher ${voucherId}?`)) return;

            allVouchers = allVouchers.filter(v => (v.voucherId || v.id) !== voucherId);
            localStorage.setItem(LS_KEY_PETTY, JSON.stringify(allVouchers));
            renderVouchersTable();
            showToast(`Voucher ${voucherId} deleted.`, 'info');

            try {
                await fetch(`/api/petty-cash/${encodeURIComponent(voucherId)}`, { method: 'DELETE' });
            } catch(e) {}
        }

        function copyVoucherId(id) {
            navigator.clipboard.writeText(id).then(() => {
                showToast(`Copied Voucher ID: ${id}`, 'info');
            });
        }

        // ─────────────────────────────────────────────────────────────
        // RECEIPT VIEWER
        // ─────────────────────────────────────────────────────────────
        function openReceiptModal(url, vId) {
            const modal = document.getElementById('receiptViewModal');
            const img = document.getElementById('fullReceiptImg');
            const linkDiv = document.getElementById('receiptLinkContainer');
            const extLink = document.getElementById('externalReceiptLink');
            const title = document.getElementById('receiptModalTitle');

            if (title) title.textContent = `Receipt for ${vId}`;

            if (url.startsWith('data:') || url.startsWith('blob:') || url.match(/\.(jpeg|jpg|gif|png|webp)($|\?)/i)) {
                img.src = url;
                img.style.display = 'block';
                linkDiv.style.display = 'none';
            } else {
                img.style.display = 'none';
                linkDiv.style.display = 'block';
                extLink.href = url;
            }

            modal.classList.add('active');
        }

        function closeReceiptModal() {
            document.getElementById('receiptViewModal').classList.remove('active');
        }

        // ─────────────────────────────────────────────────────────────
        // SEARCH & FILTERS
        // ─────────────────────────────────────────────────────────────
        function handleSearch() {
            renderVouchersTable();
        }

        function handleTechFilterChange(val) {
            activeTechFilter = val;
            const labelEl = document.getElementById('techFilterLabel');
            if (labelEl) {
                if (val === 'all') labelEl.textContent = 'All Techs';
                else {
                    const select = document.getElementById('techFilterSelect');
                    const text = select.options[select.selectedIndex]?.text || val;
                    labelEl.textContent = text.split(' ')[0] || val;
                }
            }
            renderVouchersTable();
        }

        // ─────────────────────────────────────────────────────────────
        // EXPORT & PRINT
        // ─────────────────────────────────────────────────────────────
        function exportToExcel() {
            if (!filteredVouchers || filteredVouchers.length === 0) {
                showToast('No vouchers to export', 'warning');
                return;
            }

            const exportData = filteredVouchers.map(v => ({
                "Voucher ID": v.voucherId || v.id || '',
                "Date of Purchase": v.dateOfPurchase || v.date || '',
                "Amount (AED)": parseFloat(v.amount) || 0,
                "Item / Description": v.item || v.description || '',
                "Technician": v.userName || v.user || '',
                "Employee Code": v.empCode || v.employeeCode || '',
                "Status": v.status || 'Submitted',
                "Supervisor Remarks": v.remarks || '',
                "Timestamp": v.timestamp || ''
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Petty Cash");
            XLSX.writeFile(wb, `Tabreed_Petty_Cash_${new Date().toISOString().slice(0,10)}.xlsx`);
            showToast('Exported to Excel successfully!', 'success');
        }

        function printVoucherSlip(voucherId) {
            const v = allVouchers.find(item => (item.voucherId || item.id) === voucherId);
            if (!v) return;

            const printWindow = window.open('', '_blank');
            const html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Petty Cash Slip - ${v.voucherId}</title>
                    <style>
                        body { font-family: -apple-system, sans-serif; padding: 25px; color: #1e293b; }
                        .slip-box { max-width: 480px; margin: 0 auto; border: 2px solid #0284c7; border-radius: 12px; padding: 20px; }
                        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
                        .title { font-size: 1.25rem; font-weight: 800; color: #0284c7; }
                        .meta-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.95rem; }
                        .amount { font-size: 1.5rem; font-weight: 800; color: #10b981; }
                        .signatures { margin-top: 30px; display: flex; justify-content: space-between; padding-top: 15px; border-top: 1px dashed #cbd5e1; }
                        .sig-line { width: 140px; text-align: center; border-top: 1px solid #64748b; font-size: 0.8rem; margin-top: 35px; }
                    </style>
                </head>
                <body>
                    <div class="slip-box">
                        <div class="header">
                            <div>
                                <div class="title">TABREED AUTOMATION</div>
                                <div style="font-size:0.8rem; color:#64748b;">PETTY CASH VOUCHER SLIP</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-weight:800; color:#0284c7;">${v.voucherId || v.id}</div>
                                <div style="font-size:0.8rem; color:#64748b;">${v.dateOfPurchase || v.date}</div>
                            </div>
                        </div>
                        <div style="margin: 18px 0;">
                            <div class="meta-row"><span>Claimant / Technician:</span><strong>${v.userName || v.user} (${v.empCode || '-'})</strong></div>
                            <div class="meta-row"><span>Item / Reason:</span><strong>${v.item || v.description}</strong></div>
                            <div class="meta-row"><span>Claimed Amount:</span><span class="amount">AED ${(parseFloat(v.amount)||0).toFixed(2)}</span></div>
                            <div class="meta-row"><span>Status:</span><strong>${v.status || 'Submitted'}</strong></div>
                            ${v.remarks ? `<div class="meta-row"><span>Remarks:</span><em>${v.remarks}</em></div>` : ''}
                        </div>
                        <div class="signatures">
                            <div class="sig-line">Claimant Signature</div>
                            <div class="sig-line">Supervisor Approval</div>
                        </div>
                    </div>
                    <script>window.onload = function() { window.print(); }<\/script>
                </body>
                </html>
            `;
            printWindow.document.write(html);
            printWindow.document.close();
        }

        // ─────────────────────────────────────────────────────────────
        // UTILITIES
        // ─────────────────────────────────────────────────────────────
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'warning' ? 'fa-exclamation-triangle' : (type === 'error' ? 'fa-times-circle' : 'fa-info-circle'));
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${escapeHTML(msg)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 250);
            }, 3000);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function UtilitiesFormatNow() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${pad(now.getDate())}.${pad(now.getMonth()+1)}.${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        // ─────────────────────────────────────────────────────────────
        // INITIALIZATION
        // ─────────────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            applyTheme();
            checkUserAuth();
            loadInitialData();

            setInterval(() => {
                if (!document.hidden && navigator.onLine) {
                    silentBackgroundSync();
                }
            }, 15000);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && navigator.onLine) {
                    silentBackgroundSync();
                }
            });

            window.addEventListener('focus', () => {
                if (navigator.onLine) {
                    silentBackgroundSync();
                }
            });
        });
    </script>
</body>
</html>
