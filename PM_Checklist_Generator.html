<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Checklist Generator</title>
    <script>
        (function() {
            try {
                var _fetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
                var defineFetchProp = function(target) {
                    if (!target) return;
                    try {
                        Object.defineProperty(target, 'fetch', {
                            get: function() { return _fetch; },
                            set: function(val) { _fetch = val; },
                            configurable: true,
                            enumerable: true
                        });
                    } catch (_) {}
                };
                defineFetchProp(window);
                if (typeof Window !== 'undefined' && Window.prototype) {
                    defineFetchProp(Window.prototype);
                }
            } catch (e) {}
            try {
                window.addEventListener('error', function(event) {
                    if (
                        (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
                        (event.message && (
                            event.message.indexOf('Cannot set property fetch') !== -1 ||
                            event.message.indexOf('fetch of #<Window>') !== -1
                        ))
                    ) {
                        event.preventDefault();
                        if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
                        return true;
                    }
                }, true);
            } catch (e) {}
        })();
    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #f0f2f5;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        iframe {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
    <link rel="stylesheet" href="themes.css">
</head>
<body>
    <div class="container" style="height:100vh;">
        <iframe src="https://script.google.com/macros/s/AKfycbyeoJRA2WhN0pWxmE_ZPE9Q1-_G3xvNneHoBMbMJvlGoKITNhQ1InqAQd0OLU9wYzSRzw/exec"></iframe>
    </div>
<div class="toast-container" id="toastContainer"></div>
</body>
</html>
